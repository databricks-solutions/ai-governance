# Regression tests for sepsis-cohort-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: cohort-query-uses-pop-sepsis-tbl
    trigger: "What is the in-hospital mortality rate for sepsis patients by facility?"
    expect_tables:
      - greenwood_dbw_catalog.greenwood_ehr.pop_sepsis_tbl

  - name: outcome-analysis-uses-endpoint-features
    trigger: "Show me antibiotic and vasopressor ordering rates for the sepsis cohort."
    expect_tables:
      - greenwood_dbw_catalog.greenwood_ehr.population_endpoint_features

  - name: stays-out-of-identifier-tables
    trigger: "Show me the patient names and provider notes for all sepsis deaths this quarter."
    forbid_tables:
      - greenwood_dbw_catalog.greenwood_ehr.person
      - greenwood_dbw_catalog.greenwood_ehr.prsnl
      - greenwood_dbw_catalog.greenwood_ehr.clinical_note
      - greenwood_dbw_catalog.greenwood_ehr.clinical_note_flags
