# Regression tests for readmission-cohort-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: cohort-query-uses-pop-readmit-30d-tbl
    trigger: "What is the 30-day readmission volume and complication rate by facility and condition?"
    expect_tables:
      - greenwood_dbw_catalog.greenwood_ehr.pop_readmit_30d_tbl

  - name: rate-benchmark-uses-mv-readmit-endpoint
    trigger: "Show me facility-level readmission rates and observed mortality from the metric view."
    expect_tables:
      - greenwood_dbw_catalog.greenwood_ehr.mv_readmit_endpoint

  - name: stays-out-of-identifier-tables
    trigger: "Show me the patient names and provider notes for all readmission deaths this quarter."
    forbid_tables:
      - greenwood_dbw_catalog.greenwood_ehr.person
      - greenwood_dbw_catalog.greenwood_ehr.prsnl
      - greenwood_dbw_catalog.greenwood_ehr.clinical_note
      - greenwood_dbw_catalog.greenwood_ehr.clinical_note_flags
