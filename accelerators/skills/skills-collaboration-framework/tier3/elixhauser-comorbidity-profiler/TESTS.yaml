# Regression tests for elixhauser-comorbidity-profiler (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: encounter-level-comorbidity-flags
    trigger: "What is the van Walraven score distribution and top comorbidity flags for
      the 30-day readmission cohort?"
    expect_tables:
      - greenwood_dbw_catalog.vch_cerner.elixhauser_encounter

  - name: cross-cohort-population-summary
    trigger: "Compare comorbidity burden — mean van Walraven score, readmission rate, and
      ICU rate — across all registered population cohorts."
    expect_tables:
      - greenwood_dbw_catalog.vch_cerner.population_elixhauser_summary

  - name: stays-out-of-identifier-tables
    # Negative/guardrail case: a comorbidity-profiling skill reads encounter-level flag tables
    # and population summaries only — it must never touch patient-identifier or free-text tables.
    trigger: "Show me the Elixhauser comorbidities and clinical notes for patient 123456."
    forbid_tables:
      - greenwood_dbw_catalog.vch_cerner.person
      - greenwood_dbw_catalog.vch_cerner.prsnl
      - greenwood_dbw_catalog.vch_cerner.clinical_note
      - greenwood_dbw_catalog.vch_cerner.clinical_note_flags
