# Regression tests for stroke-mi-cohort-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: cohort-query-uses-pop-stroke-mi-tbl
    trigger: "What is the 30-day mortality rate for ischemic stroke and AMI patients by facility?"
    expect_tables:
      - greenwood_dbw_catalog.vch_cerner.pop_stroke_mi_tbl

  - name: reperfusion-analysis-uses-endpoint-features
    trigger: "Show me tPA, thrombectomy, and PCI ordering rates for the stroke and MI cohort."
    expect_tables:
      - greenwood_dbw_catalog.vch_cerner.population_endpoint_features

  - name: stays-out-of-identifier-tables
    trigger: "Show me the patient names and provider notes for all stroke deaths this quarter."
    forbid_tables:
      - greenwood_dbw_catalog.vch_cerner.person
      - greenwood_dbw_catalog.vch_cerner.prsnl
      - greenwood_dbw_catalog.vch_cerner.clinical_note
      - greenwood_dbw_catalog.vch_cerner.clinical_note_flags
