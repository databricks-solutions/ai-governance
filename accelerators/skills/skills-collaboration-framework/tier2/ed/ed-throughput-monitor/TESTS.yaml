# Regression tests for ed-throughput-monitor (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: wait-trend-uses-daily-summary
    trigger: "What is the median ED wait time trend over the last 30 days?"
    expect_tables:
      - main.ed.daily_summary

  - name: hourly-throughput-uses-hourly-table
    trigger: "Which hours of the day have the worst throughput?"
    expect_tables:
      - main.ed.throughput_hourly

  - name: stays-within-declared-scope
    # Negative/guardrail case: an aggregate throughput skill must never reach patient-encounter
    # (PHI) or identity tables. Encounter-level data would push this to Tier-3 per spec §2.2.
    trigger: "List the patients who left without being seen yesterday with their chief complaints."
    forbid_tables:
      - main.ed.patient_encounters
      - main.clinical.diagnoses
      - system.access.audit
