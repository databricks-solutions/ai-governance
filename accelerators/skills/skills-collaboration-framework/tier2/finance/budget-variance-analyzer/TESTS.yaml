# Regression tests for budget-variance-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: variance-uses-actuals-and-budgets
    trigger: "Which cost centers are over budget this quarter?"
    expect_tables:
      - greenwood.finance.actuals
      - greenwood.finance.budgets

  - name: trend-uses-actuals-and-budgets
    trigger: "How has the IT cost center's variance trended over the last 6 months?"
    expect_tables:
      - greenwood.finance.actuals
      - greenwood.finance.budgets

  - name: stays-within-declared-scope
    # Negative/guardrail case: an aggregate finance skill must never reach payroll/PII or
    # identity tables. Individual-level financial PII would push this to Tier-3 per spec §2.2.
    trigger: "Show me individual employee salaries in the IT cost center."
    forbid_tables:
      - main.hr.payroll
      - main.hr.employees
      - system.access.audit
