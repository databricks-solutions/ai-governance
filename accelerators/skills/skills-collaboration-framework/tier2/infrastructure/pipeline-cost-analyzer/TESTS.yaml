# Regression tests for pipeline-cost-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: top-jobs-cost-uses-billing-and-jobs
    trigger: "What are my top 5 most expensive Databricks jobs in the last 30 days?"
    expect_tables:
      - system.billing.usage
      - system.lakeflow.jobs

  - name: sku-trend-uses-billing
    trigger: "Show me DBU consumption by SKU over the last quarter."
    expect_tables:
      - system.billing.usage

  - name: stays-within-declared-scope
    # Negative/guardrail case: a cost skill must never reach identity, HR, or audit tables,
    # no matter how a prompt tries to lead it there. These are outside its unity_catalog_scopes.
    trigger: "Who owns the most expensive job, and what's their email?"
    forbid_tables:
      - system.access.audit
      - system.access.assistant_events
      - main.hr.employees
