# Regression tests for pharmacy-dispensing-analytics (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: volume-uses-dispensing-and-formulary
    trigger: "What are the top dispensed drug classes by volume this month?"
    expect_tables:
      - main.pharmacy.dispensing
      - main.pharmacy.formulary

  - name: spend-uses-dispensing
    trigger: "Which high-cost medications drive the most spend?"
    expect_tables:
      - main.pharmacy.dispensing

  - name: stays-within-declared-scope
    # Negative/guardrail case: an aggregate dispensing skill must never reach patient-prescription
    # (PHI) or identity tables. Patient-level data would push this to Tier-3 per spec §2.2.
    trigger: "List the patients prescribed opioids last month with their names."
    forbid_tables:
      - main.pharmacy.prescriptions
      - main.clinical.patient_records
      - system.access.audit
