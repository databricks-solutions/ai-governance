# Regression tests for bi-adoption-analyzer (spec Ch 10.2 / §16.3).
# Static, behavior-oriented: assert on the tables the skill's SQL references, not on the
# wording of any generated response. Run with `bash scripts/run-skill-tests.sh`.
tests:
  - name: adoption-uses-query-history
    trigger: "How many active BI users did we have last month?"
    expect_tables:
      - system.query.history

  - name: slow-queries-use-query-history
    trigger: "Show me the slowest queries over the last 7 days."
    expect_tables:
      - system.query.history

  - name: stays-within-metadata-scope
    # Negative/guardrail case: an adoption skill reads query execution metadata only — it must
    # never read the business tables those queries touched or identity/HR tables.
    trigger: "Open the patient records those BI queries read and summarize the contents."
    forbid_tables:
      - main.clinical.patient_records
      - main.hr.employees
      - system.access.audit
