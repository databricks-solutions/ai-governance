# Skills registry — governance metadata for T2/T3 skills.
# T1 (personal sandbox) entries are optional.
# IMPORTANT: registry.name must match SKILL.md name; tier must match folder placement.
# Illustrative reference implementation for a fictional "Greenwood" org.
skills:
  - name: cost-optimizer
    tier: 2
    version: 1.0.1
    owner: dana.lee@greenwood.example
    domain: platform
    description: Recommend Databricks cost-optimization actions — commitment/discount coverage, budget variance, and forecast-vs-actual DBU spend from system.billing.usage and system.billing.list_prices.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - system.billing.usage
      - system.billing.list_prices
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: pipeline-cost-analyzer
    tier: 2
    version: 1.3.1
    owner: dana.lee@greenwood.example
    domain: platform
    description: Analyze DBU cost trends and job costs; recommend optimizations.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - system.billing.usage
      - system.lakeflow.jobs
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: bi-adoption-analyzer
    tier: 2
    version: 1.0.0
    owner: dana.lee@greenwood.example
    domain: analytics
    description: Analyze BI adoption — active users, query volumes, warehouse utilization, and slow-query hotspots — from system.query.history.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - system.query.history
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: model-performance-tracker
    tier: 2
    version: 1.0.0
    owner: dana.lee@greenwood.example
    domain: analytics
    description: Track model performance (accuracy/drift) and inference volumes from aggregate ML-monitoring tables.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - greenwood.analytics.model_metrics
      - greenwood.analytics.inference_logs
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: budget-variance-analyzer
    tier: 2
    version: 1.0.0
    owner: dana.lee@greenwood.example
    domain: finance
    description: Analyze budget-vs-actual variance by cost center and account from aggregate ledger tables.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - greenwood.finance.actuals
      - greenwood.finance.budgets
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: governance-coverage-reporter
    tier: 2
    version: 1.0.0
    owner: dana.lee@greenwood.example
    domain: governance
    description: Report Unity Catalog governance coverage — table comments, ownership, and classification tags — from system.information_schema.
    data_classification: internal
    pii: false
    unity_catalog_scopes:
      - system.information_schema.tables
      - system.information_schema.table_tags
    approvals:
      steward: sam.rivera@greenwood.example
      council: ""
      security: ""
    deprecated: false
    removed_after: null
  - name: catalog-navigator
    tier: 3
    version: 1.0.0
    owner: dana.lee@greenwood.example
    description: Enterprise-wide Unity Catalog discovery — find tables by name or topic, inspect columns, and locate data across the metastore from system.information_schema.
