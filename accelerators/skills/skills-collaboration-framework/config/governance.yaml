# governance.yaml — single people-and-roles directory. The platform team owns this file.
# Owner-eligible = the union of every email listed anywhere below.
# This is an illustrative reference implementation for a fictional "Greenwood" org.
platform_team:
  - dana.lee@greenwood.example
tier2:
  stewards:
    # Four neutral, cross-industry example domains. In a real org each domain names its own
    # steward(s); here a small set keeps the reference readable.
    #   platform    — platform / infrastructure / cost engineering
    #   analytics   — BI and data-science analytics
    #   finance     — financial planning & analysis
    #   governance  — data governance & catalog stewardship
    platform:
      - sam.rivera@greenwood.example
    analytics:
      - sam.rivera@greenwood.example
    finance:
      - sam.rivera@greenwood.example
    governance:
      - sam.rivera@greenwood.example
tier3:
  # Distinct council and security roles (council != security), as a real org would separate them.
  council:
    - priya.nair@greenwood.example
  security:
    - marcus.chen@greenwood.example
