name: Bug Report
description: Report a bug or issue encountered in the workshop or accelerators
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide details so we can reproduce and fix it.

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: What went wrong? What did you expect to happen?
      placeholder: "e.g., The 'Test connection' step fails with 401 Unauthorized even though grants are set correctly..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Deploy the workshop app with the bundle
        2. Navigate to the Cost pillar
        3. Click 'Route a prompt'
        4. Observe the error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "The routing call should succeed and return a cost comparison..."
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Error: model endpoint not found (but the endpoint exists and is queryable)..."
    validations:
      required: false

  - type: input
    id: workspace
    attributes:
      label: Workspace / Environment
      description: "Databricks workspace name/region or other environment details"
      placeholder: "e.g., us-west-2, staging, customer-XYZ"
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: App Version / Commit
      description: If known, the app version or commit hash
      placeholder: "e.g., v0.5.0, 54910a8"
    validations:
      required: false

  - type: textarea
    id: logs_errors
    attributes:
      label: Logs / Error Messages
      description: Any error messages, stack traces, or relevant logs
      placeholder: "Copy and paste error output, browser console errors, server logs, etc."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other details that might help (config, Beta status, known limitations, etc.)
      placeholder: "e.g., This is a Beta workspace, Managed MCP is not enabled, using a custom catalog..."
    validations:
      required: false
