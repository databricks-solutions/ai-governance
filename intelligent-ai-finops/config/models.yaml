# Model registry - three categories. Pricing is REAL, not illustrative:
# each model carries its official Databricks FMAPI DBU-per-1M-token rate card
# (input/output), and the app converts to dollars with the workspace $/DBU
# (FINOPS_DBU_TO_USD, default 0.07 = the published AWS/GCP Model Serving list
# rate, matching system.billing.list_prices).
#
#   $ / 1M tokens = dbu_per_1m × $/DBU
#
# Rate-card source: Databricks Foundation Model Serving pricing
#   https://www.databricks.com/product/pricing/foundation-model-serving
#   https://www.databricks.com/product/pricing/proprietary-foundation-model-serving
# Rates captured 2026-09 from the proprietary FMAPI rate card (global endpoint,
# DBUs per 1M tokens); confirm against the page for your region/contract.
# Only models with a published pay-per-token rate are listed (e.g. DeepSeek
# v4 Pro is omitted - no public DBU rate).
