[project]
name = "ai-governance"
version = "0.1.0"
description = "Hands-on labs for running a proof of concept with Databricks Unity AI Gateway."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.40.0",
    "mlflow>=2.20.0",
    "openai>=1.50.0",
    "requests>=2.32.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "databricks-connect>=15.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Databricks notebook sources use magic comments (# MAGIC, # COMMAND) and dbutils globals.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Notebooks reference dbutils/spark/display as injected globals; keep linting lenient.
ignore = ["F821", "E402"]
