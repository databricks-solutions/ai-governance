# The accelerator notebooks run as Databricks notebooks and each `%pip install`s its own
# dependencies, so there are no project runtime dependencies. This file only configures ruff
# for linting the notebook sources locally (`uvx ruff check` or `ruff check`).
[project]
name = "ai-governance"
version = "0.1.0"
description = "Databricks AI Governance Workshop — customer app + accelerator reference notebooks."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# Databricks notebook sources use magic comments (# MAGIC, # COMMAND) and dbutils globals.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Notebooks reference dbutils/spark/display as injected globals; keep linting lenient.
ignore = ["F821", "E402"]
