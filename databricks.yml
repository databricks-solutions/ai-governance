# Databricks Asset Bundle for the Unity AI Gateway labs.
# Deploy with:  databricks bundle deploy -t dev
# Validate with: databricks bundle validate -t dev
bundle:
  name: ai-governance

include:
  - resources/*.yml

# Variables let every lab share one governed endpoint, catalog, and schema.
variables:
  catalog:
    description: Unity Catalog catalog used for governance artifacts (inference tables, usage views).
    default: main
  schema:
    description: Schema (within the catalog) used for governance artifacts.
    default: ai_governance
  gateway_endpoint:
    description: Name of the chat serving endpoint that the labs attach Gateway features to.
    default: ai-governance-gateway
  base_model:
    description: Foundation Model served behind the gateway endpoint (pay-per-token).
    default: databricks-meta-llama-3-3-70b-instruct

targets:
  dev:
    # No `mode: development` so resource names stay literal (e.g. `ai-governance-gateway`),
    # matching the variables and the names the labs/docs reference. Development mode would
    # prepend a per-user prefix that breaks the job parameters and inference-table target.
    default: true
    #
    # >>> EDIT THIS BEFORE DEPLOYING <<<
    #
    # Set this to YOUR workspace URL. It must match the host of the profile you deploy
    # with, or every bundle command fails with a host-mismatch error.
    #
    # It cannot be a bundle variable: `workspace.host` is resolved during auth setup,
    # before `${var.*}` interpolation runs, so a variable here renders literally and
    # breaks authentication.
    #
    # The host must be set explicitly (not just via the CLI profile) because the
    # external-model served entity reads `${workspace.host}` as its target URL, and that
    # substitution only resolves when the target's workspace.host is defined.
    workspace:
      host: https://your-workspace.cloud.databricks.com
