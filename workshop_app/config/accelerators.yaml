# Optional add-on accelerators — each a ~3-hour deep dive on one customer need, run after
# the core choice/cost/control workshop. Same step shape as pillars (config/steps.yaml),
# so they reuse the StepCard UI, the backend tests, and the outcomes export. `test` values
# map to server/tests_registry.py; several reuse core tests.

overview:
  title: How to use the accelerators
  body: |
    The core workshop covers the control plane across choice, cost, and control. Accelerators
    are optional ~3-hour add-ons, each on a single topic. Run the one or two that match what
    the customer needs to unblock rather than all six.

    Each uses the same **concept → Try It → Verify** flow as the core steps, is tracked in the
    same progress store, and is included in the exported outcomes.

    **To run one:**

    1. Pick the accelerator matching the customer's priority.
    2. Check its prerequisites are in place on the workspace — they are noted on the page.
    3. Work top to bottom, capturing notes as you go.
    4. Export outcomes at the end (Walkthrough → Export).

accelerators:
  - id: acc_mcp
    title: "Choice: MCP Servers"
    tagline: Managed vs external MCP, UC permissions, on-behalf-of identity, and policies.
    steps:
      - id: acc_mcp_two_kinds
        title: Two kinds of MCP — and UC objects as tools
        outcome: "We can tell managed UC-native endpoints from MCP Services and list both — the distinction that decides which controls apply."
        concept: |
          Two different things are both called "MCP" on Databricks. They are frequently
          conflated, and which one you use determines which controls apply:

          - **Managed (UC-native) endpoints** — `/api/2.0/mcp/functions|genie|sql|ai-search`.
            These expose Unity Catalog objects as tools. Governed by **authentication** and
            **UC grants**. They are *not* `MCP_SERVICE` securables, so
            **service policies cannot attach to them.**
          - **MCP Services** — `/ai-gateway/mcp-services/<catalog>.<schema>.<name>`. Real UC
            securables: the Databricks-provided `system.ai.*` services plus any
            **external/custom** server you register behind an HTTP connection. These get UC
            grants **and** service policies (ALLOW / DENY / ASK).

          Three planes run in sequence on every governed tool call:

          1. **Authenticate** — the OAuth scope decides which endpoint *family* you reach
             (`unity-catalog`, `genie`, `ai-search`, `sql`). It grants no per-object access.
          2. **Authorize** — UC grants decide the object: `USE CATALOG` + `USE SCHEMA` to
             **see** a tool, `EXECUTE` to **call** it. Holding EXECUTE without the two USE
             grants is the most common silent failure.
          3. **Behavior** — service policies inspect the request/response and return
             ALLOW / DENY / ASK. **MCP Services only.**

          The diagram below shows the full model on one page. The action lists the MCP
          services registered on this workspace.

          On the managed side specifically: the managed endpoint turns the UC functions in a
          schema into MCP tools. Note the deny behavior: a caller without `USE CATALOG` +
          `USE SCHEMA` gets an **empty list**, not an error — *deny by absence*, at object
          grain. An empty result is therefore ambiguous, so read the outcome carefully.
          Governance here is UC grants plus column masks / ABAC on the underlying data. Note
          that masks are an **access** control, not a **safety** control — they don't stop
          prompt injection, and they don't constrain what an agent does downstream with a
          result it was entitled to read.
        visual: mcp_planes
        action:
          label: List MCP services (provided & external)
          test: mcp_inventory
        verify:
          label: List tools from the managed functions endpoint
          test: mcp_managed_tools

      - id: acc_mcp_service_tools
        title: MCP Service — the live tool surface
        outcome: "We can list the live tool surface of an MCP Service over JSON-RPC."
        concept: |
          This is a `tools/call`-capable service; the tool list returns over JSON-RPC.

          One protocol detail: **JSON-RPC errors ride inside HTTP 200** over Streamable HTTP,
          so do not infer success from the status code. `MCP-Protocol-Version` is also required on every request
          after `initialize`.
        action:
          label: List tools on the configured MCP service
          test: mcp_service_tools

      - id: acc_mcp_grants
        title: Who is allowed to call it (Plane 2)
        outcome: "We can see and scope the UC grants that decide who may call an MCP service."
        concept: |
          The permission question, checked before writing any policy: this is the control
          that decides *callability*.

          By default, **`system.ai` grants `EXECUTE` to all account users**, so a provided
          service is open to the whole account until it is scoped. Recommended posture is **deny-by-absence** — register in a
          customer-owned catalog and grant explicitly, rather than revoking inside
          `system.ai`, where a schema-level revoke may not cascade to individual objects.
        action:
          label: Show UC grants on the MCP service
          test: mcp_grants

      - id: acc_mcp_obo
        title: Prove on-behalf-of identity
        outcome: "We can prove a tool runs as the calling user (on-behalf-of), not a shared service account."
        concept: |
          The tool runs as the **calling user**, not a shared
          service account. If a user can't see a record, neither can their agent — and no
          per-provider secrets are handed out.

          This calls a read tool that echoes the upstream identity, so you see a real name
          come back rather than taking OBO on trust. Have two participants run it and compare
          — different answers is the proof.

          One limitation: nothing today expresses *"the analyst may, but her agent may
          not."* The only way to separate them is to give the agent its own identity,
          typically a service principal.
        action:
          label: Call a read tool and show the caller's identity
          test: mcp_obo

      - id: acc_mcp_policy_target
        title: Confirm a policy can attach here (Plane 3)
        outcome: "We can confirm a service policy can attach to the securable before writing one."
        concept: |
          Service policies attach **only** to
          `MCP_SERVICE` securables. Point one at a managed UC-native endpoint and there is
          nothing to attach to — the product surfaces this confusingly, so verify first.

          Attaching needs `EXECUTE` on the policy function and `MANAGE` on the service.
        action:
          label: Verify the securable type
          test: mcp_policy_target

      - id: acc_mcp_policy
        title: Write and verify a contextual policy
        outcome: "We can author and verify a contextual ALLOW / DENY / ASK service policy."
        concept: |
          A service policy is a UC SQL function taking `event VARIANT` and returning
          **ALLOW**, **DENY**, or **ASK** (ASK pauses for human approval via URL-mode
          elicitation, cached an hour). It runs **ON CALL** against the request and
          **ON RESULT** against the response, and evaluation is **fail-closed** — an error
          during evaluation means DENY.

          Two implementation details: the function is
          `to_variant_object(...)` (not `to_variant`, which doesn't exist), and VARIANT paths
          need casting — `event:context.tool.name::STRING`.

          There are built-in LLM-as-judge guardrails (`system.ai.block_unsafe_content`,
          `block_jailbreak`, `block_hallucination`, and possibly `block_pii` — the reference docs
          disagree, and none of them resolve as SQL functions during Beta). **Read the actual
          list in the AI Gateway UI Policies tab** rather than quoting a name from memory, and
          don't commit to a specific built-in until you've seen it on this account.
        action:
          label: Create the policy function
          test: create_mcp_policy
        verify:
          label: Verify DENY / ALLOW logic
          test: mcp_policy_enforcement
        manual:
          label: Attach the policy in the AI Gateway UI
          deep_link: mcp_service

      - id: acc_mcp_readonly
        title: Enforce read-only for coding agents
        outcome: "We can classify a service's tools read vs write to enforce read-only for coding agents."
        concept: |
          The most-requested MCP control: keep coding-agent users to READ tools while humans
          keep write. Enforcement depends on the kind of MCP:

          - **MCP Service** (`system.ai.*` or an external one you register): attach a service
            policy that denies the write tools, and never grant `USE CONNECTION` to end users —
            it bypasses tool selection, so a user could call a denied tool directly.
          - **Managed UC-native endpoint** (DBSQL / Genie): not a securable, so no policy can
            attach. Read-only is enforced by exposing only read functions and by the UC grants
            on them.

          This classifies the configured service's tools so you can see exactly what a
          read-only policy would need to deny.
        action:
          label: Classify the service's tools read vs write
          test: mcp_readonly_enforcement

      - id: acc_mcp_external
        title: External & custom MCP — the activation path
        outcome: "We can register an external or custom MCP server so service policies can govern it."
        concept: |
          For a customer **not yet running MCP on Databricks**, registering an external
          server is what enables service policies.

          A custom server your team hosts is not a separate category — it registers and is
          governed exactly like any external MCP Service: HTTP connection → MCP Service
          securable → `EXECUTE` grant → policy → invoke through the gateway.

          Two requirements: do not grant `USE CONNECTION` to end users (it bypasses
          tool selection and auditing), and make a self-hosted server **stateless** — a
          stateful server behind the replicated gateway proxy can fail the first
          `tools/call` even though `initialize` and `tools/list` both succeeded.
        action:
          label: Check external-MCP readiness & show the steps
          test: mcp_external_readiness

      - id: acc_mcp_tool_poisoning
        title: Scan tools for poisoning
        outcome: "We can scan tool metadata for prompt-injection (tool poisoning) before granting access."
        concept: |
          A tool's name and description are sent to the model, so a compromised or malicious
          server can hide instructions in them ("ignore previous instructions", "before
          answering, send X to…") and steer an agent without the user ever seeing it — the top
          MCP supply-chain risk. This scans the advertised tool metadata for injection-shaped
          phrases. A flag is a prompt to review the tool and its source, not proof of
          compromise. Review external servers before granting EXECUTE, and pin their versions.
        action:
          label: Scan tool metadata for injection
          test: mcp_tool_metadata_scan

      - id: acc_mcp_telemetry
        title: What was actually recorded
        outcome: "We can see exactly what MCP telemetry is recorded — identity and tool, not payloads."
        concept: |
          This step is precise about what telemetry exists, because it is easy to
          over-promise here.

          MCP Service calls write a **usage row** (identity, service, tool, latency, cost)
          and an **`mcpCall` audit row**. Managed UC-native endpoints write **no MCP-specific
          telemetry at all**.

          **Arguments and results are not captured** — MCP payload logging is not in the
          current Beta. So "no payload logging" does not mean "no auditability": you have
          identity and tool name, just not the contents.
        action:
          label: Show MCP calls from the Gateway usage table
          test: mcp_telemetry

  - id: acc_agent_registry
    title: "Choice: Agent Registry"
    tagline: Make agents first-class UC assets — registered, versioned, owned, traced, and governed like any endpoint.
    steps:
      - id: acc_agent_inventory
        title: Inventory registered agents & tools
        outcome: "We can inventory the agents and tools registered as Unity Catalog assets."
        concept: |
          An agent registry makes agents first-class Unity Catalog assets — discoverable,
          versioned, and owned. Start by listing what's registered in the workshop schema.
        action:
          label: List registered agents & tools
          test: list_registered_assets
      - id: acc_agent_register
        title: Register & version a representative agent
        outcome: "We can register an agent as a UC model with an owner and a logged version."
        concept: |
          Register one representative agent as a UC model with an owner, then log a new
          version. This is the pattern to repeat across the fleet.
        manual:
          label: Register the agent in Unity Catalog (MLflow → UC model)
          deep_link: experiment
      - id: acc_agent_versions
        title: Confirm versioning & ownership
        outcome: "We can confirm each agent has an owner and a version history, not a one-off deploy."
        concept: |
          A one-off deploy is not a registered agent. Each agent should be a UC model with an
          owner and a version history, so it is reproducible and rollback-able. This lists the
          registered agents with their version count and owner.
        action:
          label: Check agent versions & owners
          test: agent_versions
      - id: acc_agent_trace
        title: Confirm traces & telemetry
        outcome: "We can confirm the telemetry tables behind agent traces are populated."
        concept: |
          A registered agent should emit MLflow traces (tool calls, responses, latency) and
          carry a clear UC owner. Confirm the telemetry tables that back this are populated.
        verify:
          label: Check AI telemetry tables
          test: telemetry_readiness
      - id: acc_agent_sp
        title: Govern the agent endpoint itself
        outcome: "We can check which controls (rate limits, guardrails, usage tracking) an agent endpoint actually carries."
        concept: |
          A custom agent endpoint deployed on the gateway may lack the controls a model endpoint
          has — rate limits, guardrails, usage tracking — and its service principal may not even
          be selectable in the rate-limit UI. Where a control is missing, that agent's traffic is
          ungoverned. This inspects agent-like endpoints and reports which controls each carries.
        action:
          label: Check limits/guardrails/usage tracking on agent endpoints
          test: agent_sp_attribution
      - id: acc_agent_acl
        title: Who can call the agent endpoint
        outcome: "We can review who is allowed to call the agent endpoint and spot over-broad grants."
        concept: |
          An agent endpoint has an ACL like any serving endpoint: `CAN_QUERY`, `CAN_VIEW`,
          `CAN_MANAGE`. A broad group with `CAN_QUERY` means the agent is open to everyone;
          `CAN_MANAGE` lets someone reconfigure or strip controls off it. Review the ACL and
          keep manage rights with platform admins.
        action:
          label: Show the agent endpoint ACL
          test: endpoint_acl
      - id: acc_agent_guardrails
        title: Guardrails on the agent endpoint
        outcome: "We can prove guardrails fire on the agent endpoint, not just on model endpoints."
        concept: |
          Agents are often assumed to inherit a model's guardrails, but a custom agent endpoint
          may have none attached. Send a prompt that should be blocked and confirm the guardrail
          fires on the agent's own endpoint.
        action:
          label: Send a blocked prompt to the agent endpoint
          test: test_guardrail
      - id: acc_agent_audit
        title: Agent activity in the audit trail
        outcome: "We can see agent activity in the audit trail and scan it for leaked secrets."
        concept: |
          Agent calls land in `system.access.audit` alongside every other governed call. Query
          recent denied/failed agent activity and scan the arguments for secret-shaped strings,
          so the agent fleet is auditable like the rest of the estate.
        action:
          label: Query agent activity & scan for secrets
          test: audit_scan
      - id: acc_agent_eval
        title: Evaluate the agent with MLflow judges
        outcome: "We can score the agent's quality with MLflow LLM-as-judge evaluations."
        concept: |
          A registered agent should be evaluated, not just deployed. The accelerator notebook
          `agent_evaluation.py` scores an agent's output with MLflow LLM-as-judge metrics against
          a labeled set, so quality is tracked over versions rather than assumed.
        manual:
          label: Run agent_evaluation.py (LLM-judge scoring)
      - id: acc_agent_lifecycle
        title: Promote and retire agent versions
        outcome: "We can promote and retire agent versions through Unity Catalog for a clean lifecycle."
        concept: |
          A registry is only honest if versions are promoted and retired deliberately. Use UC
          model aliases/versions to promote a validated version and deprecate an old one, so the
          fleet has a clear, rollback-able lifecycle rather than an accumulation of one-off deploys.
        manual:
          label: Promote/retire versions in Unity Catalog

  - id: acc_coding_agent
    title: "Cost: Coding Agents"
    tagline: Route dev-agent traffic through the gateway, prove it is actually governed, attribute per developer, and cap the spend.
    steps:
      - id: acc_coding_route
        title: Route coding-agent traffic through the Gateway
        outcome: "We can route Claude Code / Cursor / ucode / Codex through the governed gateway."
        concept: |
          Claude Code, Cursor, `ucode`, and Codex call model providers directly by default.
          Pointing them at the governed model service (OpenAI-compatible base URL + the service
          FQN as the model) puts every request behind the gateway's limits, guardrails, and
          telemetry.

          Prefer **OAuth** over a PAT. OAuth tokens auto-refresh on a short lifetime; a PAT is
          long-lived and carries the broad `all-apis` scope, so a leaked one is far more
          damaging. `ucode` is the quickest path — it configures the base URL and per-user
          OAuth for you.
        manual:
          label: Open the governed endpoint (copy the base URL)
          deep_link: serving_endpoint
      - id: acc_coding_route_check
        title: Is it actually routed?
        outcome: "We can confirm coding-agent traffic actually lands on the governed model service, not a legacy endpoint."
        concept: |
          The most common silent failure: the client is "pointed at the gateway" but still
          resolves a legacy or provided endpoint name, so the limits and guardrails configured
          on the new model service never apply — and nothing errors to say so.

          A gateway call that names a plain **endpoint** records `service_name` as NULL; a call
          that names a **model-service FQN** records `service_name`. This check splits recent
          coding-agent traffic on that column, so drift onto the legacy contract is visible.
        action:
          label: Check where coding-agent traffic is actually landing
          test: coding_agent_route_check
      - id: acc_coding_attribution
        title: Per-developer attribution
        outcome: "We can attribute coding-agent spend and usage per developer with no tagging required."
        concept: |
          Coding agents identify themselves in `user_agent` (`claude-cli/…`, `ucode/…`,
          `cursor/…`), so traffic attributes per developer with no tagging required. This is the
          governance win for this surface: spend and usage roll up to a real person.
        action:
          label: Check coding-agent usage & attribution
          test: coding_agent_usage
      - id: acc_coding_path_coverage
        title: Do the controls fire on the path the agent uses?
        outcome: "We can check whether guardrails and limits fire on the provider-native path coding agents use."
        concept: |
          Guardrails and rate limits are reliably enforced on the OpenAI-compatible chat path
          (`/ai-gateway/mlflow/v1/chat/completions`). Coding agents often call the
          **provider-native** path (`/ai-gateway/anthropic/v1/messages`). Whether the same
          controls fire there is account- and version-dependent — and a control that silently
          does not fire on the path a client actually uses is the most dangerous kind of gap.

          This probes the same guardrail-triggering prompt on both paths and compares. Treat it
          as a diagnostic to run on the account, not a promise.
        action:
          label: Compare guardrail coverage across both gateway paths
          test: path_coverage_check
      - id: acc_coding_rate_limit
        title: Prove the rate limit bites (HTTP 429)
        outcome: "We can prove a per-user rate limit throttles a coding agent with HTTP 429."
        concept: |
          A rate limit is the hard cost control — an exceeded limit returns **HTTP 429**
          immediately, unlike a budget alert, which does not block. Set a low per-user limit in
          the AI Gateway UI, then send a burst and watch it throttle.

          Two things to expect: rate-limit changes can take up to ~1–2 hours to take effect, and
          the limit must apply to the caller's identity (or be endpoint-wide) to trip.
        manual:
          label: Set a low per-user rate limit on the endpoint
          deep_link: serving_endpoint
        verify:
          label: Send a burst and look for a 429
          test: rate_limit_429_demo
      - id: acc_coding_budget
        title: Cap the spend with a budget
        outcome: "We can cap coding-agent spend with a budget and read 30-day spend per developer."
        concept: |
          Attribution shows who is spending; a budget bounds it. Set a budget with alert
          thresholds — and a hard cap where available — in the account console, then read the
          30-day spend the gateway records per model and user.

          Alerts are GA; hard "block usage" caps are rolling out, so confirm hard enforcement on
          the account before promising it.
        manual:
          label: Open account-console budgets
          deep_link: account_budgets
        action:
          label: Show 30-day spend by model and user
          test: budget_status
      - id: acc_coding_secrets
        title: Code-secret detection
        outcome: "We can detect secret-shaped strings leaked by coding agents in the audit log."
        concept: |
          Coding agents can leak API keys and tokens in prompts. Scan recent activity for
          secret-shaped strings (`sk-…`, `AKIA…`, `ghp_…`) to prove detection is in place.
        verify:
          label: Scan for leaked secrets in the audit log
          test: audit_scan
      - id: acc_coding_model_choice
        title: Pin the approved model list
        outcome: "We can pin which models coding agents are allowed to call to an approved list."
        concept: |
          Left to defaults, every developer picks their own model. Governing coding-agent model
          choice means an approved list enforced centrally — pin the models the governed endpoint
          exposes so agents can only call what is sanctioned, rather than any frontier model a
          developer names.
        manual:
          label: Set the approved-model list for coding agents
      - id: acc_coding_readonly_mcp
        title: Keep coding agents read-only on MCP
        outcome: "We can classify MCP tools read vs write to keep coding agents read-only."
        concept: |
          Coding agents that also call MCP tools should be held to read tools while humans keep
          write. Classify the service's tools read vs write so you can see exactly what a
          read-only policy for the coding-agent identity would need to deny.
        action:
          label: Classify the service's tools read vs write
          test: mcp_readonly_enforcement
      - id: acc_coding_guardrails
        title: Guardrails on the coding path
        outcome: "We can prove guardrails fire on the path coding agents actually use."
        concept: |
          Coding agents send code and sometimes secrets or customer data in prompts. Confirm the
          safety/PII guardrail actually fires by sending a prompt that should be blocked through
          the governed endpoint the agents use.
        action:
          label: Send a blocked prompt through the coding path
          test: test_guardrail

  - id: acc_external_provider
    title: "Choice: External Providers"
    tagline: Route Bedrock, OpenAI, and Anthropic through the gateway with credentials in secrets and access bound to approved workspaces.
    steps:
      - id: acc_ext_inventory
        title: Inventory current provider access
        outcome: "We can map how external providers are reached today across serving endpoints."
        concept: |
          Map how external providers are reached today (direct keys, another proxy). The
          target is a single governed path; this lists the serving endpoints that exist.
        action:
          label: List serving endpoints
          test: list_endpoints
      - id: acc_ext_route
        title: Route a provider through the Gateway
        outcome: "We can route Bedrock/OpenAI/Anthropic through a governed endpoint so they inherit limits, guardrails, and logging."
        concept: |
          Register Bedrock / OpenAI / Anthropic as external models behind a governed endpoint,
          with business-relevant tags, so they inherit the same limits, guardrails, and logging.

          For Anthropic specifically, the newer **OAuth-relay** path lets you connect a
          Claude subscription without storing a long-lived key — the gateway relays a
          short-lived token. Prefer it where available; otherwise the key goes in a secret
          (next step).
        manual:
          label: Add an external-model endpoint in the workspace
          deep_link: serving_endpoint
        verify:
          label: Find external-provider routes on this workspace
          test: external_provider_routing
      - id: acc_ext_secrets
        title: Credentials in secrets, never inline
        outcome: "We can confirm provider keys are stored as secrets, never inline."
        concept: |
          A provider key pasted into config is the pitfall the guide calls out first. Store it
          in a Databricks secret scope and reference it as `{{secrets/<scope>/<key>}}` — a read
          of the endpoint then returns the reference, never the value. This lists the secret
          scopes present and checks which external-model endpoints reference a secret.
        action:
          label: Check provider keys are stored as secrets
          test: provider_secret_readiness
      - id: acc_ext_binding
        title: Bind approved models to approved workspaces
        outcome: "We can confirm approved models are bound to approved workspaces via catalog isolation."
        concept: |
          "Approved models" is only advisory until the catalog holding them is
          `isolation_mode = ISOLATED` with explicit workspace bindings — otherwise any workspace
          on the metastore can bind the catalog and use what is in it. This reports the catalog's
          isolation mode and its bindings.
        action:
          label: Check catalog isolation & workspace bindings
          test: workspace_binding_check
      - id: acc_ext_migrate
        title: Migrate one shadow workload as proof
        outcome: "We can migrate a shadow workload onto the governed endpoint and see it attribute by project."
        concept: |
          Pick one workload that currently bypasses governance and move it onto the governed
          endpoint. Then confirm its traffic and cost now attribute by project tag.
        verify:
          label: Confirm routed usage by project
          test: usage_by_project
      - id: acc_ext_provider_ban
        title: Ban a provider or model family org-wide
        outcome: "We can ban a provider or model family org-wide in one action."
        concept: |
          A governed plane means model-provider choice is a policy, not a free-for-all. When
          legal, jurisdictional, or security requirements demand it, you can disable a provider
          or a whole model family org-wide in one action, rather than chasing down per-developer
          keys.
        manual:
          label: Disable a provider/model family in the AI Gateway
      - id: acc_ext_guardrails
        title: Guardrails on external routes
        outcome: "We can prove guardrails fire on external-provider routes."
        concept: |
          Routing an external provider through the gateway is only a win if the controls apply.
          Send a prompt that should be blocked through the external-model endpoint and confirm
          the guardrail fires there, the same as on a native model service.
        action:
          label: Send a blocked prompt to the external route
          test: test_guardrail
      - id: acc_ext_rate_limits
        title: Rate limits on external routes
        outcome: "We can enforce rate limits on external-provider routes."
        concept: |
          External provider spend is easy to run away with. Confirm QPM/TPM rate limits are
          enforced on the external-model endpoint so a runaway client hits HTTP 429 rather than a
          surprise invoice.
        action:
          label: Show enforced rate limits on the external route
          test: rate_limits
      - id: acc_ext_spend
        title: Spend by external provider
        outcome: "We can read spend by external provider to see where the money goes."
        concept: |
          `system.ai_gateway.external_model_spend` reports estimated USD per model for
          external-provider traffic. Break it down to see which provider dominates spend and
          where a routing or budget policy has the most leverage.
        action:
          label: Show 30-day spend by external provider
          test: gateway_spend_by_model
      - id: acc_ext_fallback
        title: Fallback & traffic splitting
        outcome: "We can configure fallback and traffic splitting across providers for resilience."
        concept: |
          A single provider is a single point of failure. Configure a fallback model and split
          traffic across providers/versions so an outage or rate limit on one provider fails over
          rather than failing the workload. See `fallbacks.py` in this accelerator.
        manual:
          label: Configure fallback/traffic-split (see fallbacks.py)

  - id: acc_policies_guardrails
    title: "Control: Policies & Guardrails"
    tagline: Prove guardrails actually work — block vs mask, how a block is delivered, path coverage, and effectiveness.
    steps:
      - id: acc_pg_guardrail
        title: Safety & PII guardrail on input and output
        outcome: "We can configure safety & PII guardrails on input and output and prove a prompt is blocked."
        concept: |
          Configure the Gateway safety filter and PII detection on the governed endpoint
          (input and output), then send a prompt that should be blocked to prove it fires. A
          block is the pass condition here.
        manual:
          label: Configure guardrails in the AI Gateway UI
          deep_link: serving_endpoint
        action:
          label: Send a blocked prompt (expect block)
          test: test_guardrail
      - id: acc_pg_mask_vs_block
        title: Mask vs block
        outcome: "We can tell whether PII is blocked, masked, or passed through intact."
        concept: |
          BLOCK refuses the request; MASK lets it through with the PII removed. MASK is the more
          common production choice — a benign request that happens to contain PII still gets an
          answer. This sends a prompt that echoes a synthetic SSN and classifies the outcome:
          blocked, masked, or passed through intact.
        action:
          label: Probe whether PII is blocked, masked, or passed through
          test: pii_mask_vs_block
      - id: acc_pg_block_shape
        title: How a block is delivered (and fail-closed)
        outcome: "We can see how a block is delivered (4xx vs HTTP 200 + reason) and that evaluation is fail-closed."
        concept: |
          A block can come back two ways: a **4xx error**, or **HTTP 200 with a refusal reason**.
          It matters for coding agents — they resend conversation history, so a 4xx block on one
          turn can re-trigger on every later benign turn ("sticky block") until a new session.
          The rolling fix returns 200 + a reason so the client can continue. This reports which
          shape your account returns.

          Either way, evaluation is **fail-closed**: if a policy or guardrail errors while
          evaluating, the gateway returns DENY — never a silent allow.
        action:
          label: Send a blocked prompt and report the block shape
          test: guardrail_block_shape
      - id: acc_pg_path_coverage
        title: Does the guardrail fire on every path?
        outcome: "We can check the guardrail fires on every gateway path, not just the OpenAI-compatible one."
        concept: |
          A guardrail is only as good as its coverage. Controls are reliably enforced on the
          OpenAI-compatible chat path; whether they also fire on the provider-native path that
          coding agents use is account- and version-dependent. This probes the same
          guardrail-triggering prompt on both paths and compares — a silent gap here means the
          guardrail does not cover the traffic you care about.
        action:
          label: Compare guardrail coverage across both gateway paths
          test: path_coverage_check
      - id: acc_pg_effectiveness
        title: Measure effectiveness — benchmark & red-team
        outcome: "We can confirm the payloads and telemetry a guardrail benchmark and red-team review need are present."
        concept: |
          "Is the guardrail on?" is not "does it work?". The guardrail benchmark
          (`accelerators/policies-and-guardrails/guardrail_benchmark.py`) scores guardrails on a **labeled** set
          across PII redaction, PII blocking, unsafe content, jailbreak/prompt-injection, and
          hallucination — online guardrails versus an offline LLM-as-judge — and can tune a
          policy to cut the false-positive rate. This step confirms the payloads and telemetry
          that a judge and red-team review read from are present, so the benchmark has data to
          score. Custom / in-house guardrails plug in at the same layer.
        verify:
          label: Check guardrail + judge readiness (payloads, telemetry)
          test: pii_safety_readiness
      - id: acc_pg_review
        title: Review guardrail activity
        outcome: "We can review which guardrails fired and for whom."
        concept: |
          Every blocked request lands in the inference table. Review which guardrails fired
          and for whom.
        action:
          label: Show guardrail activity
          test: guardrail_activity
      - id: acc_pg_prompt_injection
        title: Prompt-injection & jailbreak
        outcome: "We can enable prompt-injection / jailbreak protection and prove it blocks a jailbreak."
        concept: |
          Content safety is not the same as prompt-injection defense. Enable the
          jailbreak / prompt-injection guardrail and test a known jailbreak prompt to confirm it
          is blocked — this is the control for customer-facing assistants that untrusted users
          can prompt directly.
        manual:
          label: Enable jailbreak/prompt-injection guardrail; test a jailbreak prompt
      - id: acc_pg_groundedness
        title: Hallucination & groundedness
        outcome: "We can enable a groundedness guardrail and flag an ungrounded response."
        concept: |
          For RAG and assistant use cases, a confident but ungrounded answer is the risk. Enable
          the groundedness guardrail and test an ungrounded prompt to confirm the response is
          flagged or blocked rather than passed through as fact.
        manual:
          label: Enable groundedness guardrail; test an ungrounded prompt
      - id: acc_pg_policy_authoring
        title: Author a custom policy
        outcome: "We can author a custom policy function beyond the built-in guardrails."
        concept: |
          Built-in guardrails cover common cases; org-specific rules need a custom policy. Author
          a UC SQL policy function (ALLOW/DENY/ASK) so the policy plane enforces your own
          definition of a violation, not only the vendor's pre-built set.
        action:
          label: Create a custom policy function
          test: create_mcp_policy
      - id: acc_pg_per_use_case
        title: Per-use-case / per-agent policies
        outcome: "We can attach different policies per use case or per agent, not one-size-fits-all."
        concept: |
          A single global policy is rarely right — a medical assistant and an internal code
          helper need different rules. Attach different policies per use case or per agent so the
          control matches the risk of each surface rather than the lowest common denominator.
        manual:
          label: Attach different policies per use case/agent

  - id: acc_skills
    title: "Control: Skills"
    tagline: Build, govern, and deploy Agent Skills in Genie Code — a runtime allowlist and a tiered registry.
    steps:
      - id: acc_skills_what
        title: What an Agent Skill is — and the three instruction layers
        outcome: "We can explain what an Agent Skill is and the three instruction layers it sits in."
        concept: |
          An **Agent Skill** is a markdown file (instructions + a couple of examples) that
          teaches the Databricks Assistant / Genie Code a new capability. It lives in the
          workspace skills folder `~/.assistant/skills/` and shows up under
          **Assistant → Settings → Agent Skills**.

          Genie Code takes instructions from three layers, from personal to org-wide:

          - **User instructions** — `~/.assistant_instructions.md`, editable by the user (type
            `#` in chat to add one fast). Personal, per-user.
          - **Workspace instructions** — set by a workspace admin, applied across the workspace.
          - **Agent Skills** — the markdown files in `~/.assistant/skills/`. This is the layer
            you govern.

          The hands-on notebook for this accelerator is
          `accelerators/skills/build_a_skill.py`, with a sample skill in
          `accelerators/skills/example_skill.md`.
      - id: acc_skills_dupe_check
        title: Dupe-check before building
        outcome: "We can dupe-check the registry so we discover an existing skill instead of rebuilding it."
        concept: |
          Before building anything, search the registry: discovery beats rebuilding the same
          skill a fifth time. A quick dupe-check against the tiered registry is the cheapest
          governance step there is — it keeps the catalog small and trustworthy.
        manual:
          label: Search the registry for an existing skill before building
      - id: acc_skills_create
        title: Build and place a minimal skill
        outcome: "We can build a minimal skill and place it in the workspace allowlist."
        concept: |
          Write a small skill file — a title, a few lines of instruction, and two worked
          examples — and drop it in `~/.assistant/skills/`. Keep it narrow: one capability done
          well beats a catch-all. `example_skill.md` is a governance-relevant starting point (a
          Unity Catalog query helper) you can adapt.
        manual:
          label: Create a skill .md and save it under ~/.assistant/skills/
      - id: acc_skills_verify
        title: See it load — and prove the allowlist
        outcome: "We can prove the skills folder is a runtime allowlist — in it is invokable, out of it is not."
        concept: |
          Open **Assistant → Settings → Agent Skills** and confirm your skill appears. Then the
          governance point: a skill **in** the folder is invokable; a skill **not** in the folder
          cannot be called, no matter how a user prompts. The folder *is* the allowlist, and it
          is enforced at runtime — not advisory. Move a skill out, refresh, and watch it become
          uninvokable.
        manual:
          label: Confirm the skill in Agent Skills settings; test in-allowlist vs removed
      - id: acc_skills_tier
        title: Classify the skill into a tier and register it
        outcome: "We can classify a skill into a tier and register it with owner, data scope, and tags."
        concept: |
          Friction should scale with risk, not block everything:

          - **Tier 1 — personal**: sandbox, no production data, no review. Keep this
            zero-friction, or people route around governance.
          - **Tier 2 — team**: peer- and steward-reviewed, limited data scope.
          - **Tier 3 — enterprise**: security review, evals, full audit trail, regulated data.

          Pick a tier and write the skill's `registry.yaml` entry — owner, tier, tags, declared
          data scope, and (for Tier 2/3) an eval score. Before building anything, **dupe-check**
          the registry: discovery beats rebuilding the same skill a fifth time.
        manual:
          label: Add a registry.yaml entry (owner, tier, data scope, tags)
      - id: acc_skills_github_workflow
        title: The GitHub registry and its PR gates
        outcome: "We can promote skills through a GitHub PR with lint, secret-scan, and eval gates."
        concept: |
          Skills live in one Git repo — `/tier1`, `/tier2`, `/tier3`, and a `registry.yaml`
          manifest — governed by the tools engineers already trust. Promotion is a pull request:
          CI runs **lint**, **secret scan**, and the **eval suite**; CODEOWNERS routes the right
          steward; merge means published. Publishing and governance are the same act, so there is
          no path to users that skips the gates. A GitHub Action then syncs merged skills to
          workspaces (`databricks workspace import-dir`): Tier 2 to its domain workspace, Tier 3
          everywhere. This accelerator includes that framework repo in full at
          `accelerators/skills/skills-collaboration-framework/` — copy it into your own repo and
          open a PR to see the gates fire.
      - id: acc_skills_eval
        title: Make the skill testable — a minimal eval
        outcome: "We can make a skill testable with a minimal LLM-judge eval."
        concept: |
          A skill without an eval is a hope, not a control. Write 3–5 golden prompt/answer pairs
          and score the skill's output with an LLM-as-judge against a Databricks foundation-model
          endpoint — the notebook does exactly this. Evals gate Tier 2/3 promotion and, run on a
          schedule, catch drift over time rather than only at publish.
        manual:
          label: Run the eval cells in build_a_skill.py (golden Q&A + judge)
      - id: acc_skills_security
        title: Security & data-classification gates
        outcome: "We can pass a skill through secret-scan and data-classification gates."
        concept: |
          Two gates every skill passes before it can touch anything sensitive: a **secret scan**
          over the skill text (no `sk-…`, `AKIA…`, `ghp_…` baked into instructions or examples)
          and a **declared data classification** the skill's data scope must not exceed. Auth
          rides Unity Catalog, so a skill can only reach what its identity is granted — the same
          governance surface as the rest of this workshop, not a parallel one. The notebook runs
          the secret scan for you.
        manual:
          label: Run the secret-scan cell; confirm the declared data scope
      - id: acc_skills_deploy
        title: Deploy and retire
        outcome: "We can deploy and retire skills so the registry stays a living allowlist."
        concept: |
          Deployment is the GitHub Action sync above landing the skill in the workspace
          allowlist, where Genie Code auto-loads it on relevant prompts. Retirement is what keeps
          the registry honest: a deprecation notice, a migration path, and removal from the
          allowlist so a stale skill stops being invokable. Propose → design → build → review →
          publish → operate → **retire** — the last step is the one that makes this a living
          registry instead of a wiki page.
      - id: acc_skills_audit
        title: Audit skill usage
        outcome: "We can audit which skills are invoked and by whom."
        concept: |
          A living registry needs usage visibility: which skills are actually invoked, by whom,
          and how often. Review skill invocation so unused skills can be retired and heavily used
          ones can be hardened — governance informed by real usage, not guesswork.
        manual:
          label: Review which skills are invoked and by whom
