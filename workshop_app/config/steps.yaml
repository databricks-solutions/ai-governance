# AI Governance Workshop — step definitions (the guidebook content).
#
# Steps are grouped by pillar (choice / cost / control) — the Aug 2026 messaging
# source of truth. Each step has:
#   id       : stable key used for progress tracking (the JSON progress file on the UC volume)
#   title    : shown in the UI
#   concept  : the "why" (markdown) — the CONCEPT card
#   action   : optional Try-It test; `test` names a backend test (see server/routes/tests.py)
#   verify   : optional follow-up check that proves it worked
#   manual   : optional UI-only step the customer does in the workspace (with a deep link)
#
# `test` values map to backend handlers; `null`/absent means the step is guided-only.

intro:
  title: What this workshop covers
  body: |
    In about **three hours of hands-on work** (plus roughly **an hour of slides and
    discussion**), this workshop stands up a governed AI control plane on your own workspace.
    Every step runs against this workspace, not a simulation.

    Three pillars:

    - **Choice** — place any model, tool, or agent behind one control plane, addressed by a
      Unity Catalog name instead of a workspace endpoint name — and see which of your endpoints
      are still on the legacy (v1) path versus the governed (v3) path.
    - **Cost** — project what routing between models saves, set budgets and rate limits, and
      attribute each request to a team.
    - **Control** — rate limits, guardrails, and MCP service policies that deny specific calls,
      with the telemetry that records them.

    Each step has a plain-language concept, a **Try It** action that exercises the control on
    this workspace, and (where useful) a **Verify** check. Results show the exact API called and
    any SQL run — and every query the app runs also lives as plain SQL in the repo's `queries/`
    folder, so you can copy and re-run it yourself. Progress saves automatically.

    Expect the account team to spend about an hour on slides too — the product roadmap and any
    topics your team hasn't seen yet — around the hands-on core.

    Begin with **Prerequisites** if you have not: two `system` grants require an account admin
    and gate the telemetry steps (cost and audit). The workshop still runs without them — those
    steps just show "action needed" until the grants are in place.

  # Step-by-step deploy guide shown on the Walkthrough. Structured (not one markdown blob) so
  # each step renders as a numbered "do this / ensure this" card. `do` and `ensure` accept
  # inline markdown (**bold**, `code`, *italics*, links); `cmd` is shown verbatim in a code box.
  deploy:
    title: Deploy this workshop in your own workspace
    intro: >-
      You run this in your own Databricks workspace to try the capabilities first-hand. It is a
      standard Databricks Asset Bundle — no scripts, about ten minutes end to end.
    steps:
      - do: >-
          **Install the Databricks CLI and log in.** This creates a named profile you reuse in
          the commands below.
        cmd: |
          databricks auth login --host https://<your-workspace>.cloud.databricks.com
        ensure: "`databricks current-user me -p <profile>` prints your username."
      - do: "**Get the code and open the app folder.**"
        cmd: |
          git clone https://github.com/databricks-solutions/ai-governance
          cd ai-governance/workshop_app
      - do: >-
          **Choose a catalog and a SQL warehouse.** The app deploys into a catalog you already
          have and runs every live check through the warehouse.
        cmd: |
          databricks warehouses list -p <profile>
        ensure: >-
          The catalog already exists (the app creates only its own schema inside it) and the
          warehouse is running — a serverless warehouse starts fastest.
      - do: >-
          **Deploy the bundle.** This builds the UI and creates the schema, the progress volume,
          and the app — and grants the app's own service principal on them in one pass.
        cmd: |
          databricks bundle deploy -t dev -p <profile> --var="warehouse_id=<id>" --var="catalog=<catalog>"
        ensure: "It finishes with `Deployment complete!` and no errors."
      - do: >-
          **Start the app.** A deploy alone does not start app compute, so this second command
          is required.
        cmd: |
          databricks bundle run ai_governance_workshop_app -t dev -p <profile> --var="warehouse_id=<id>" --var="catalog=<catalog>"
        ensure: >-
          Open the URL it prints, then check `GET /api/health` returns
          `{"status":"ok","config_problems":[]}`. If it lists a problem, that is exactly what
          still needs setting.
      - do: >-
          **(Optional) Grant the two `system` schemas.** An account admin runs the GRANTs shown
          in *What the app needs from your workspace*, just below. The workshop runs without them
          — the eight telemetry steps show "action needed" until they are in place.
    footer: "Made a change and want it live? Re-run the last two commands — deploy, then run."

pillars:
  - id: choice
    title: Choice
    tagline: Any model, tool, or agent behind one control plane, addressed as a UC securable.
    steps:
      - id: choice_connect
        title: "Choice: Connect to the workspace"
        outcome: "The app reaches your workspace and SQL warehouse and reads its config — the base every later step runs on."
        concept: |
          This app runs as a Databricks App with its own service principal. Confirm it can reach
          your SQL warehouse and read its config — every later step depends on both.
        action:
          label: Test connection
          test: connection
        verify:
          label: Show workspace context
          test: workspace_context

      - id: choice_list_endpoints
        title: "Choice: Inventory endpoints & flag v1 vs v3"
        outcome: "We can inventory every serving endpoint and agent, and split recent traffic into the legacy (v1) vs governed (v3) path to expose the migration backlog."
        concept: |
          Two views of the same surface. First, **every serving endpoint** on this workspace:
          foundation models, external models, and custom ones — the inventory you are about to
          govern.

          Then the migration question, answered from real traffic. A request that names a
          **legacy endpoint** rides the **v1** path (`/serving-endpoints`); a request that names
          a **model service** (a Unity Catalog name) rides the **v3** path (`/ai-gateway`). The
          Verify step reads `system.ai_gateway.usage` and splits your last 30 days of traffic
          into v1 versus v3. Any v1 traffic is a **migration backlog**: it breaks when the v1
          killswitch flips, so it has to move to a model service first.

          The exact query is in `queries/endpoint_inventory_v1_v3.sql` — copy it to re-check on
          your own after the workshop.
        action:
          label: List serving endpoints
          test: list_endpoints
        verify:
          label: Split recent traffic into v1 (legacy) vs v3 (model service)
          test: endpoint_inventory_v1_v3

      - id: choice_model_services
        title: "Choice: Put a model behind a governed name"
        outcome: "We can stand a model up as a Unity Catalog model service (catalog.schema.service) with a stable client contract and UC-grant access."
        concept: |
          Controls used to hang off a **workspace serving endpoint**: the endpoint name was the
          application contract and access was a workspace ACL. They now hang off a **model
          service** — a Unity Catalog object with a fully-qualified name (`catalog.schema.service`).

          Two things this buys you:

          - **A stable contract.** Swap the model, add a fallback, or split traffic, and the
            application keeps calling the same name. Permissions become UC grants, which apply
            across every workspace on the metastore.
          - **Access you can reason about.** Provided model services are **closed by default** —
            callable only by an identity granted `EXECUTE` (directly or inherited). So the
            question isn't "what is everyone exposed to?" but "what can *this* identity reach?"
            You check that with UC grants on the service, the same question you'd ask of any
            pilot user before rollout.

          The client change is exactly two things, and they must move **together**:

          - **Base URL** — `/serving-endpoints` → `/ai-gateway/mlflow/v1`
          - **Model selector** — `<endpoint-name>` → `<catalog>.<schema>.<service>`

          A new base URL with an old endpoint name fails; so does a name against the legacy path.
          There is **no in-place rename**: stand the service up alongside the old endpoint,
          validate on real traffic, move clients in stages, then revoke the old path. A 200
          response is not acceptance — compare latency, tokens, cost, and output quality.

          **Model services stack.** Put a broad service in front of a base model for the whole
          enterprise and attach the policies everyone should get; put team-specific services in
          front of it with their own tighter policies, budgets, and grants. Enterprise defaults
          at the base, team rules on top — the same layering you already use for data.
        action:
          label: Show model services & the client contract
          test: model_services

      - id: choice_default_access
        title: "Choice: Lock down who can call models"
        outcome: "We can confirm model services are closed by default and reachable only by granted identities — access is a Unity Catalog grant, not a per-developer key."
        concept: |
          Provided model services are **closed by default**: callable only by an identity granted
          `EXECUTE` (directly or inherited). So the question is never "what is everyone exposed to?"
          but "what can *this* identity reach?" — the same question you'd ask of a pilot user before
          rollout. This reads the **effective permissions** for the app's own identity against the
          model services and reports which it can actually call. It is read-only — it reports reach,
          it never changes a grant. The takeaway: access to AI assets is a UC grant you can reason
          about, not a per-developer API key sprayed across the org.
        action:
          label: Show who can call the models (effective access)
          test: default_access

  - id: cost
    title: Cost
    tagline: Project routing cost, cap spend and throughput, and attribute each request.
    steps:
      - id: cost_model_panel
        title: "Cost: Models & prices"
        outcome: "We can see the models available to route across and their per-token prices — the basis for routing ROI."
        concept: |
          The Cost pillar reduces spend by sending each request to an appropriately priced
          model rather than defaulting every request to a frontier model. Routing can be owned
          three ways, differing in who holds the routing policy:

          - **Smart routing (Databricks-managed)** — the Gateway selects a model per request.
            Enabled per account and used through the Omnigent and ucode harnesses. Beta.
          - **Omnigent (partner layer)** — a meta-harness above Claude Code, Codex, Cursor, and
            custom agents, routing above the harness and governed through the same Gateway.
          - **Custom router** — a classifier scores each request and sends it to the cheapest
            model that meets a defined bar.

          The router changes; the control plane does not. This panel lists the three configured
          models and their per-token prices. The following steps use those prices to project
          monthly cost and to estimate routing.
        action:
          label: Show the models and prices
          test: routing_panel

      - id: cost_routing_compare
        title: "Cost: Project routing savings"
        outcome: "We can run prompts across models, measure the tokens each returns, and project the monthly savings from routing each request to the cheapest sufficient model."
        concept: |
          This step runs the configured prompts against all three models, measures the tokens
          each returns, and multiplies the per-request cost by the monthly request volume set
          in `cost.routing.requests_per_month` (default 10,000). The result is the projected
          monthly cost of sending every request to each model, alongside the estimated cost of
          routing each request to the cheapest sufficient model.

          The prompts and each model's answer are shown, so the output can be assessed on
          quality as well as price. The smart-routing figure is an estimate: it classifies each
          prompt's complexity and prices the cheapest model that meets it. Dollar figures depend
          on the DBU rate in config; token counts are measured.
        action:
          label: Compare monthly cost across models
          test: routing_compare

      - id: cost_spend_by_model
        title: "Cost: Spend by model"
        outcome: "We can read 30-day estimated USD spend per model to see where the money actually goes — and where a routing policy has the most leverage."
        concept: |
          `system.ai_gateway.external_model_spend` reports **estimated USD directly** (no
          price-list join needed) for external-provider traffic through the Gateway. Break it
          down by model to see which models dominate spend — that is where a routing policy
          has leverage, and it grounds the ROI estimate in this account's real mix.
        action:
          label: Show 30-day spend by model
          test: gateway_spend_by_model

      - id: cost_rate_limits
        title: "Cost: Rate limits (the hard control)"
        outcome: "We can enforce QPM/TPM rate limits per service, user, and group and see HTTP 429 when exceeded — the ceiling that reliably holds today."
        concept: |
          Two controls, easily conflated. **Rate limits** cap *throughput* — exceeding one
          returns HTTP 429 immediately. They are GA. **Budgets** cap *spend*, and today they
          reliably **alert**; hard blocking is still rolling out. Rate limits are therefore the
          control that reliably enforces a hard ceiling today.

          They apply per service, per user, and per group, in queries/minute (QPM) and
          tokens/minute (TPM), with the most restrictive limit winning. This reads back what
          is enforced on the governed endpoint; set limits in the AI Gateway UI so the
          workshop never changes throughput on a live customer endpoint.
        action:
          label: Show enforced rate limits
          test: rate_limits
        manual:
          label: Set a rate limit on the endpoint
          deep_link: serving_endpoint

      - id: cost_budgets
        title: "Cost: Budgets & thresholds"
        outcome: "We can set account budgets with alert thresholds and read the spend they govern, pairing them with rate limits for a hard ceiling."
        concept: |
          Budgets are scoped to the account and configured in the account console, with
          shared and per-user thresholds. **Alerts are GA; hard blocking is rolling out** —
          confirm on this account before telling a FinOps owner that spend is hard-capped.

          Enforcement is based on near-real-time estimates, so thresholds are approximate in
          both directions. Pair budgets with the rate limit above: the budget tells you when
          spend is drifting, the rate limit is what actually stops it.

          Two things teams keep asking for:

          - **Self-service visibility.** A team lead or model user does not need admin to see
            their own spend against a budget — they run `queries/budget_status.sql` (the same
            query this step runs) filtered to their model or user. Hand them the query, not the
            console.
          - **Exhaustion alerts.** Set an alert threshold when you create the budget, then confirm
            the notification actually fires as spend approaches it. An alert nobody receives is
            not a control — validate the delivery, and note whether your org needs a programmatic
            (API-driven) budget-change path rather than the UI.
        action:
          label: Show 30-day spend the budget governs
          test: budget_status
        manual:
          label: Create a budget (with an alert threshold) in the account console
          deep_link: account_budgets

      - id: cost_usage
        title: "Cost: Attribute usage by team/tag"
        outcome: "We can split AI usage by model service and tag to attribute spend to teams — distinguishing caller request-tags from budget-safe server-side tags."
        concept: |
          `system.ai_gateway.usage` rolls tokens up by project tag — the basis for attributing
          and forecasting AI spend. First, how a request gets tagged, because it decides what you
          can trust:

          - **Request tags** are supplied per-request by the caller
            (`Databricks-Ai-Gateway-Request-Tags`). Great for attribution and analytics, but
            **caller-controlled** — never a budget boundary. Every model call in the routing steps
            above already sent this header, so that traffic is attributed live.
          - **Server-side tags** are set by the platform owner on the service and apply to every
            request through it. These are the only ones a FinOps owner can trust as a budget
            filter, because the caller cannot change them. (Note: the SDK's
            `serving_endpoints.query()` can't send request tags — it uses the legacy invocations
            path; tagging means calling `/ai-gateway/mlflow/v1/chat/completions`, as this app does.)

          The result below splits the count on exactly that line: **request-tagged** calls prove
          per-caller attribution works end to end; **endpoint-tagged** calls are the ones safe to
          budget on. Both, ideally. The query is in `queries/usage_by_project.sql`.

          If you see request-tagged traffic and **zero** endpoint-tagged, that is the finding,
          not a bug: attribution is working, but only in the form a caller can switch off. Fix
          it by tagging the service itself, not by trusting the header.

          The table is **not real-time**. On a reference workspace the latest recorded event
          stayed 13-21 minutes behind the wall clock, so an empty result right after the
          routing steps means *not ingested yet*, not *tagging is broken*. Check
          `SELECT max(event_time) FROM system.ai_gateway.usage` before treating it as a fault.
        action:
          label: Query usage by project tag
          test: usage_by_project

  - id: control
    title: Control
    tagline: Policies, guardrails, identity propagation, and the telemetry that records them.
    steps:
      - id: control_governed_endpoint
        title: "Control: Create a governed endpoint"
        outcome: "We can put a control layer in front of a model — fallback, inference-table logging, usage tracking, and the attach point for guardrails and rate limits."
        concept: |
          A governed endpoint puts a control layer in front of a model: a fallback for
          resilience, an inference table logging every payload, usage tracking, and the
          attachment point for guardrails and rate limits.
        action:
          label: Create / verify governed endpoint
          test: create_governed_endpoint
        verify:
          label: Check endpoint config
          test: verify_governed_endpoint

      - id: control_endpoint_acl
        title: "Control: Who is allowed to call it"
        outcome: "We can review endpoint ACLs (CAN_QUERY / CAN_VIEW / CAN_MANAGE) and spot over-broad or shadow-endpoint grants."
        concept: |
          The access question, at endpoint grain: **`CAN_QUERY`**, `CAN_VIEW`, and
          `CAN_MANAGE`. Two things to read carefully in the result:

          - A broad group holding `CAN_QUERY` means the governed endpoint is open to everyone,
            which undoes the scoping you set up in Choice.
          - `CAN_MANAGE` is the **shadow-endpoint risk** — it lets someone reconfigure the
            model or strip the guardrails off it. Keep it with platform admins only.

          Note what this does *not* cover: provided foundation-model endpoints have no
          workspace ACL at all. Those are governed by the UC grants on the model service — the
          two controls are separate, and you need both.
        action:
          label: Show the endpoint ACL
          test: endpoint_acl

      - id: control_guardrails
        title: "Control: Guardrails that fire"
        outcome: "We can screen inputs and outputs for PII and unsafe content and prove a blocked prompt is actually stopped."
        concept: |
          Guardrails screen inputs and outputs for PII, unsafe content, and blocked keywords.
          Configure PII and safety filters in the AI Gateway UI — there is no full CRUD API yet.
          The keyword blocklist is a UC SQL function you attach as a policy.

          A **blocked** request is the pass condition here. If the prompt gets answered, the
          guardrail is not attached.
        manual:
          label: Open the endpoint's Guardrails tab
          deep_link: serving_endpoint
        action:
          label: Test the guardrail (send a blocked prompt)
          test: test_guardrail
        verify:
          label: Show guardrail activity from the inference table
          test: guardrail_activity

      - id: control_mcp_policy
        title: "Control: Contextual MCP policy"
        outcome: "We can attach a UC SQL service policy that allows read tools and denies write tools, running as the calling user (on-behalf-of)."
        concept: |
          MCP services expose tools to agents. A **service policy** is a UC SQL function that
          inspects each tool call and returns ALLOW or DENY — allow reads, deny writes.
          Identity propagates: the tool runs as the calling user, not a shared service account.

          Two details that cost debugging time: the function is `to_variant_object(...)` (there
          is no `to_variant`), and VARIANT paths need casting —
          `event:context.tool.name::STRING`.
        action:
          label: Create the policy function
          test: create_mcp_policy
        manual:
          label: Attach the policy in the AI Gateway UI
          deep_link: mcp_service
        verify:
          label: Test a write tool (expect DENY) and a read tool (expect ALLOW)
          test: test_mcp_policy

      - id: control_audit
        title: "Control: Audit & secret-leak scan"
        outcome: "We can query the audit trail for denied and failed calls and scan tool arguments for secret-shaped strings."
        concept: |
          `system.access.audit` records who called what and whether a policy fired. This scans
          recent denied and failed calls, and looks for secret-shaped strings (`sk-`, `AKIA`,
          `ghp_`) in the arguments. The query is in `queries/audit_scan.sql`.
        action:
          label: Query denied calls & scan for secrets
          test: audit_scan

      # Trimmed from the core for the 3-hour format, and re-addable on request:
      #   - control_coding_agents  -> lives in the Coding Agents accelerator (deeper treatment).
      #   - control_traces         -> lives in the Agent Registry accelerator.
      #   - control_lakewatch      -> Lakewatch is not enabled on most accounts; its telemetry is
      #                               already proven by cost_usage and control_audit.
      # The backend tests (coding_agent_usage, telemetry_readiness) still exist and are used by
      # those accelerators, so re-adding a core step is a config-only change.
