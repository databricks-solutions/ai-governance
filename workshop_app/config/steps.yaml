# AI Governance Workshop - step definitions (the guidebook content).
#
# Steps are grouped by pillar. Tab order is control / choice / cost: lead with governance
# (create the governed model service and the policies that attach to it), then model choice,
# then cost. Each step has:
#   id       : stable key used for progress tracking (the JSON progress file on the UC volume)
#   title    : shown in the UI
#   tier     : mandatory | recommended | optional - shown as a badge so the room scans fast
#   where    : where the action runs (this app / AI Gateway UI / Account console)
#   outcome  : the one-line result (shown under the title), direct and imperative
#   concept  : short "why + how" (markdown). Point-form. Implementation first.
#   action   : optional Try-It test; `test` names a backend test (see server/routes/tests.py)
#   verify   : optional follow-up check that proves it worked
#   manual   : optional UI-only step the customer does in the workspace (with a deep link)
#
# Target: ~2 hours, 15 core steps (Control 5 / Choice 5 / Cost 5). The workshop is the bridge
# from demo to POC: turn Unity Gateway on and clear the setup paper cuts. It does not reach prod.
# `test` values map to backend handlers; `null`/absent means the step is guided-only.

intro:
  title: What this workshop covers
  body: |
    About **two hours hands-on**, plus a short slide intro. Stand up a governed AI control plane
    on **your own workspace**, every step live.

    - **Control** - create one governed model service, then attach the policies, guardrails, and
      rate limits everything else inherits. Start here.
    - **Choice** - put any model, tool, or agent behind one Unity Catalog name. Flag endpoints
      still on the legacy (v1/v2) path for migration.
    - **Cost** - see spend, project routing savings, set budgets, and attribute spend by team
      and task.

    This workshop is the bridge from demo to POC: turn Unity Gateway on and clear the setup paper
    cuts. The workshop identifies potential blockers to putting Unity Gateway into production at
    your organization.

    Each step shows a one-line outcome, a **Try It** that runs live, and a **Verify** check,
    tagged **mandatory**, **recommended**, or **optional**, with where to run it. Progress saves
    automatically. New here? Start with **Prerequisites**: an account admin runs two `system`
    grants before the session.

    The Databricks team can help evaluate focuses for the workshop using the
    [AI governance maturity assessment](https://github.com/databricks-solutions/ai-governance/blob/main/workshop_app/docs/AI_Governance_Maturity_Assessment.xlsx)
    (a static copy in this repo) and the
    [AI Governance field portal](http://go/aigovernance) (Databricks internal link).

  # Step-by-step deploy guide shown on the Walkthrough. Structured (not one markdown blob) so
  # each step renders as a numbered "do this / ensure this" card. `do` and `ensure` accept
  # inline markdown (**bold**, `code`, *italics*, links); `cmd` is shown verbatim in a code box.
  deploy:
    title: Deploy this workshop in your own workspace
    intro: >-
      You run this in your own Databricks workspace to try the capabilities first-hand. It is a
      standard Databricks Asset Bundle. No scripts, about ten minutes end to end.
    steps:
      - do: >-
          **Install the Databricks CLI and log in.** This creates a named profile you reuse in
          the commands below.
        cmd: |
          databricks auth login --host https://<your-workspace>.cloud.databricks.com
        ensure: "`databricks current-user me -p <profile>` prints your username."
      - do: "**Get the code and open the app folder.**"
        cmd: |
          git clone https://github.com/databricks-solutions/ai-governance
          cd ai-governance/workshop_app
      - do: >-
          **Choose a catalog and a SQL warehouse.** The app deploys into a catalog you already
          have and runs every live check through the warehouse.
        cmd: |
          databricks warehouses list -p <profile>
        ensure: >-
          The catalog already exists (the app creates only its own schema inside it) and the
          warehouse is running. A serverless warehouse starts fastest.
      - do: >-
          **Deploy the bundle.** This builds the UI and creates the schema, the progress volume,
          and the app. It grants the app's own service principal on them in one pass.
        cmd: |
          databricks bundle deploy -t dev -p <profile> --var="warehouse_id=<id>" --var="catalog=<catalog>"
        ensure: "It finishes with `Deployment complete!` and no errors."
      - do: >-
          **Start the app.** A deploy alone does not start app compute, so this second command
          is required.
        cmd: |
          databricks bundle run ai_governance_workshop_app -t dev -p <profile> --var="warehouse_id=<id>" --var="catalog=<catalog>"
        ensure: >-
          Open the URL it prints. Check `GET /api/health` returns
          `{"status":"ok","config_problems":[]}`. If it lists a problem, that is what still needs
          setting.
      - do: >-
          **(Optional) Grant the two `system` schemas.** An account admin runs the GRANTs shown
          in *What the app needs from your workspace*, just below. The workshop runs without them.
          The telemetry steps show "action needed" until they are in place.
    footer: "Made a change and want it live? Re-run the last two commands - deploy, then run."

pillars:
  - id: control
    title: Control
    tagline: Create the governed model service, then the policies, guardrails, and audit that attach to it.
    steps:
      - id: control_model_service
        title: "Control: Create the governed model service"
        tier: mandatory
        where: AI Gateway UI
        outcome: "Stand up a governed model service (catalog.schema.service): the attach point for rate limits, guardrails, policies, and an inference table that logs every payload."
        concept: |
          Every control in this workshop attaches to a **governed model service**: a Unity
          Catalog securable (`catalog.schema.service`), not a legacy serving endpoint. Create it
          first, early in the day, because the later steps read it.

          It puts a control layer in front of a base model: a fallback for resilience, an
          inference table that logs every payload, usage tracking, and the attach point for rate
          limits (Cost) and guardrails (below).

          - **Try It** checks whether the model service exists. If not, it hands you the config to
            create it in the AI Gateway UI.
          - **Verify** confirms it is present with its rate-limit and inference-table config.

          The app never creates the service unattended on a customer workspace. You create it in
          the UI.
        action:
          label: Create / verify governed model service
          test: create_governed_endpoint
        verify:
          label: Check model-service config
          test: verify_governed_endpoint

      - id: control_endpoint_acl
        title: "Control: Review who can call the model service"
        tier: recommended
        where: this app
        outcome: "Review the Unity Catalog grants on the governed model service and spot over-broad or shadow-service grants."
        depends_on: [control_model_service]
        concept: |
          On the Unity Gateway plane, "who may call this model?" is a UC grant on the model-service
          securable. Read two privileges carefully:

          - **`EXECUTE`** is the right to call the service. A broad group (for example
            `account users`) holding it means everyone can call the service.
          - **`MANAGE`** is the shadow-service risk. It lets someone reconfigure the model or strip
            its guardrails. Keep it with platform admins only.

          **Try It** reads the grants on the model-service securable and flags a broad group holding
          EXECUTE or MANAGE. It is read-only.
        action:
          label: Show the model-service grants
          test: endpoint_acl

      - id: control_guardrails
        title: "Control: Prove a guardrail blocks a prompt"
        tier: mandatory
        where: AI Gateway UI
        outcome: "Screen inputs and outputs for PII and unsafe content, and prove a blocked prompt is actually stopped."
        depends_on: [control_model_service]
        concept: |
          Guardrails screen inputs and outputs for PII, unsafe content, and blocked keywords. Set
          PII and safety filters in the AI Gateway UI. There is no full CRUD API yet. The keyword
          blocklist is a UC SQL function you attach as a policy.

          A **blocked** request is the pass condition.

          - **Try It** sends a blocked prompt. If it gets answered, the guardrail is not attached.
          - **Verify** shows the guardrail activity from the inference table.
        manual:
          label: Open the model service to attach guardrails
          deep_link: model_service
        action:
          label: Test the guardrail (send a blocked prompt)
          test: test_guardrail
        verify:
          label: Show guardrail activity from the inference table
          test: guardrail_activity

      - id: control_mcp_policy
        title: "Control: Attach a contextual MCP policy"
        tier: recommended
        where: this app
        outcome: "Attach a contextual UC SQL service policy that allows read tools and denies write tools, running as the calling user (on-behalf-of)."
        concept: |
          This is the contextual-policy control. MCP services expose tools to agents. A **service
          policy** is a UC SQL function that inspects **each tool call in context** and returns
          ALLOW or DENY: allow reads, deny writes. Identity propagates, so the tool runs as the
          calling user, not a shared service account.

          - **Try It** creates the policy function.
          - **Verify** tests a write tool (expect DENY) and a read tool (expect ALLOW).

          Two details that cost debugging time: the function is `to_variant_object(...)` (there is
          no `to_variant`), and VARIANT paths need casting (`event:context.tool.name::STRING`).
        action:
          label: Create the policy function
          test: create_mcp_policy
        manual:
          label: Attach the policy in the AI Gateway UI
          deep_link: mcp_service
        verify:
          label: Test a write tool (expect DENY) and a read tool (expect ALLOW)
          test: test_mcp_policy

      - id: control_audit
        title: "Control: Scan the audit trail for leaks and denials"
        tier: recommended
        where: this app
        outcome: "Query the audit trail for denied and failed calls and scan tool arguments for secret-shaped strings."
        concept: |
          `system.access.audit` records who called what and whether a policy fired.

          **Try It** scans recent denied and failed calls, and looks for secret-shaped strings
          (`sk-`, `AKIA`, `ghp_`) in the arguments. The query is in `queries/audit_scan.sql`.
        action:
          label: Query denied calls and scan for secrets
          test: audit_scan

  - id: choice
    title: Choice
    tagline: Any model, tool, or agent behind one control plane, addressed as a UC securable.
    steps:
      - id: choice_connect
        title: "Choice: Connect to the workspace"
        tier: mandatory
        where: this app
        outcome: "The app reaches your workspace and SQL warehouse and reads its config."
        concept: |
          This app runs as a Databricks App with its own service principal. Every live step needs
          the workspace and the SQL warehouse.

          - **Try It** confirms the app can reach the warehouse.
          - **Verify** shows the workspace it is connected to.
        action:
          label: Test connection
          test: connection
        verify:
          label: Show workspace context
          test: workspace_context

      - id: choice_list_endpoints
        title: "Choice: Inventory endpoints and flag legacy vs model services"
        tier: mandatory
        where: this app
        outcome: "Inventory every serving endpoint and agent, then split traffic into legacy vs Unity Gateway to expose the migration backlog."
        concept: |
          Two views of the same surface.

          - **Try It** lists every serving endpoint on the workspace: foundation models, external
            models, and custom models. This is the inventory you govern.
          - **Verify** reads `system.ai_gateway.usage` and splits the last 30 days of traffic.
            A legacy endpoint rides the **v1/v2** path. A model service rides the **Unity Gateway**
            path (a UC name).

          Any legacy traffic is a **migration backlog**. It breaks when the legacy killswitch
          flips, so it has to move to a model service first. The query is in
          `queries/endpoint_inventory_v1_v3.sql`.

          For the migration path off v1/v2, see the
          [Migration guide: moving to Unity AI Gateway](https://kb.databricks.com/unity-catalog/migration-guide-moving-to-unity-ai-gateway).
          For the recommended rollout, see the
          [AI Governance field portal](http://go/aigovernance) (Databricks internal link).
        action:
          label: List serving endpoints
          test: list_endpoints
        verify:
          label: Split recent traffic into legacy vs model services
          test: endpoint_inventory_v1_v3

      - id: choice_model_services
        title: "Choice: Put a model behind a governed name"
        tier: mandatory
        where: this app
        outcome: "A model is addressed as a Unity Catalog model service (catalog.schema.service) with a stable client contract and UC-grant access."
        depends_on: [control_model_service]
        concept: |
          Controls used to hang off a workspace serving endpoint. They now hang off a **model
          service**: a Unity Catalog object named `catalog.schema.service`. You created one in the
          Control tab.

          Two things this buys you:

          - **A stable contract.** Swap the model or split traffic and the app keeps calling the
            same name. Permissions become UC grants.
          - **Access you can reason about.** A model service is closed by default. Only an identity
            granted `EXECUTE` can call it.

          The client change is two things, and they move together:

          - **Base URL** - `/serving-endpoints` becomes `/ai-gateway/mlflow/v1`.
          - **Model selector** - the endpoint name becomes `catalog.schema.service`.

          **Try It** shows the model services and this client contract.
        action:
          label: Show model services and the client contract
          test: model_services

      - id: choice_default_access
        title: "Choice: Choose which models teams can access"
        tier: recommended
        where: this app
        outcome: "Each team and the wider org gets model access through Unity Catalog grants, not per-developer API keys."
        depends_on: [choice_model_services]
        concept: |
          A model service is closed by default. Access is a UC `EXECUTE` grant you can reason
          about. Grant a team the models it should have. Withhold the rest.

          **Try It** reads the effective permissions for the app's own identity and reports which
          model services it can call. It is read-only. It reports reach. It never changes a grant.
        action:
          label: Show which models this identity can access
          test: default_access

      - id: use_open_weight_model
        title: "Choice: Run proprietary and open-weight models"
        tier: recommended
        where: this app
        outcome: "Open-weight models (GLM, GPT-OSS, DeepSeek, Llama) and proprietary models (Claude, GPT) run through one governed control plane, with the same grants, policies, and attribution."
        concept: |
          Choice is not a single-vendor bet. Proprietary and open-weight models are addressed the
          same way: a Unity Gateway model service on the `/ai-gateway` path. Both carry the same
          UC grants, guardrails, rate limits, and request-tag attribution.

          Two things this proves:

          - **No lock-in.** The contract, grants, and telemetry are the same whoever trained the
            model. You govern access to models, not one lab.
          - **Data residency option.** An open-weight model served on your own compute keeps the
            payload in your account.

          **Try It** calls the configured open-weight model service
          (`gateway.open_weight_model_service` in `config/workshop.yaml`) over the Gateway. Point
          it at whichever open-weight model service your org uses.
        action:
          label: Call an open-weight model service through the Gateway
          test: use_open_weight_model

  - id: cost
    title: Cost
    tagline: See spend, project routing savings, cap spend and throughput, and attribute each request.
    steps:
      - id: cost_spend_by_model
        title: "Cost: Read 30-day spend by model"
        tier: mandatory
        where: this app
        outcome: "Read 30-day AI spend in USD, by model, to see where the money goes and where routing has the most leverage."
        concept: |
          AI spend comes from two places. This step reads both.

          - **External providers** - `system.ai_gateway.external_model_spend` reports USD directly.
          - **Internal Databricks-hosted models** (`system.ai.*`) - these bill in DBUs, priced from
            `system.billing.usage`. This needs the optional `system.billing` grant. Without it the
            dollar view reads $0 on an internal-only workspace.

          Broken down by model, this shows which models dominate spend. Dollars are list-price
          estimates until you apply a negotiated rate. Token counts are real.
        action:
          label: Show 30-day spend by model
          test: gateway_spend_by_model

      - id: cost_routing_compare
        title: "Cost: Project routing savings"
        tier: recommended
        where: this app
        outcome: "Run prompts across models, measure the tokens each returns, and project the monthly savings from routing each request to the cheapest sufficient model."
        concept: |
          Routing sends each request to an appropriately priced model instead of defaulting every
          request to a frontier model.

          - **Try It** runs the configured prompts against the three models and multiplies
            per-request cost by the monthly volume in `cost.routing.requests_per_month`
            (default 10,000). It shows each model's monthly cost and the cost of routing each
            request to the cheapest sufficient model.
          - **Verify** shows the model panel and the per-token prices behind the estimate.

          Smart routing (Databricks-managed) is in preview, and is for coding agents. It does not
          route external provider models (Anthropic, OpenAI) by design. Token counts are measured.
          Dollars depend on the DBU rate in config.
        action:
          label: Compare monthly cost across models
          test: routing_compare
        verify:
          label: Show the models and prices
          test: routing_panel

      - id: cost_rate_limits
        title: "Cost: Enforce rate limits (QPM/TPM)"
        tier: mandatory
        where: AI Gateway UI
        outcome: "Enforce QPM/TPM rate limits per service, user, and group, and see HTTP 429 when exceeded."
        depends_on: [control_model_service]
        concept: |
          Two controls, easily confused.

          - **Rate limits** cap throughput. Exceeding one returns HTTP 429 at once. GA.
          - **Budgets** cap spend. Today they reliably alert. Hard blocking is still rolling out.

          Rate limits are the control that reliably holds a hard ceiling today. They attach to the
          governed model service you created in the Control tab.

          **Try It** reads the limits set on it (QPM and TPM), per service, user, and group. Set
          limits in the AI Gateway UI so the workshop never changes throughput on a live service.
        action:
          label: Show enforced rate limits
          test: rate_limits
        manual:
          label: Set a rate limit on the model service
          deep_link: model_service

      - id: cost_budgets
        title: "Cost: Set budgets and alert thresholds"
        tier: mandatory
        where: Account console
        outcome: "Set account budgets with alert thresholds and read the spend they govern, including per-team self-service visibility."
        concept: |
          Budgets are scoped to the account and set in the account console. You created a small
          budget in the prerequisites. Here you set its alert threshold and confirm it fires.

          **Alerts are GA. Hard blocking is rolling out.** Confirm on this account before you tell
          a FinOps owner that spend is hard-capped. Pair the budget with the rate limit above: the
          budget tells you when spend drifts, the rate limit is what stops it.

          Self-service: a team lead does not need admin to see their own spend. They run
          `queries/budget_status.sql` filtered to their model or user. **Try It** runs that same
          query for the spend the budget governs.
        action:
          label: Show 30-day spend the budget governs
          test: budget_status
        manual:
          label: Set an alert threshold on the budget (account console)
          deep_link: account_budgets

      - id: cost_usage
        title: "Cost: Attribute usage by team and task"
        tier: recommended
        where: this app
        outcome: "Split AI usage by team tag and by task and model, to attribute spend and see which model does each kind of work most efficiently."
        concept: |
          `system.ai_gateway.usage` rolls tokens up by tag. How a request is tagged decides what
          you can trust:

          - **Request tags** are set per request by the caller. Good for attribution. Caller-
            controlled, so never a budget boundary.
          - **Server-side tags** are set by the platform owner on the service. A FinOps owner can
            trust these as a budget filter.

          - **Try It** splits usage by team tag. Request-tagged calls prove per-caller attribution.
            Endpoint-tagged calls are the ones safe to budget on.
          - **Verify** groups by task and model, so the lowest average-tokens row is the cheapest
            model for that task.

          The table lags real time by minutes. An empty result right after the routing steps means
          not ingested yet, not broken. Queries: `queries/usage_by_project.sql`,
          `queries/usage_by_task.sql`.
        action:
          label: Query usage by team tag
          test: usage_by_project
        verify:
          label: Show cost/tokens per task, by model
          test: cost_task_usage
