# AI Governance Workshop — step definitions (the guidebook content).
#
# Steps are grouped by pillar (choice / cost / control) — the Aug 2026 messaging
# source of truth. Each step has:
#   id       : stable key used for progress tracking in Lakebase
#   title    : shown in the UI
#   concept  : the "why" (markdown) — the CONCEPT card
#   action   : optional Try-It test; `test` names a backend test (see server/routes/tests.py)
#   verify   : optional follow-up check that proves it worked
#   manual   : optional UI-only step the customer does in the workspace (with a deep link)
#
# `test` values map to backend handlers; `null`/absent means the step is guided-only.

intro:
  title: What this workshop accomplishes
  body: |
    By the end of this half-day you will have stood up a **governed AI control plane** on
    your own workspace and proven it works — not on slides, live. You'll work through three
    pillars:

    - **Choice** — an open, multi-AI ecosystem: put any model, tool, or agent behind one
      governed control plane, and register them as first-class Unity Catalog assets.
    - **Cost** — intelligent cost controls: see the cost impact of routing between models,
      set budgets and hard spend caps, and attribute every AI dollar to a team.
    - **Control** — agent-aware data + AI governance: rate limits, guardrails, and contextual
      MCP policies that block the right requests, plus end-to-end observability of every call.

    Each step explains the concept, gives you a **Try It** action that exercises the control
    against this workspace, and a **Verify** step that proves it fired. Your progress is saved
    so you can pause and resume.

pillars:
  - id: choice
    title: Choice
    tagline: Open, multi-AI ecosystem — any model, tool, or agent behind one control plane.
    steps:
      - id: choice_connect
        title: Connect to the workspace
        concept: |
          The workshop app runs as a governed Databricks App. First we confirm it can reach
          your SQL warehouse and read the workshop config — everything downstream depends on it.
        action:
          label: Test connection
          test: connection
        verify:
          label: Show workspace context
          test: workspace_context

      - id: choice_list_endpoints
        title: Discover the model surface
        concept: |
          You can't govern what you can't see. This lists the serving endpoints available on
          the workspace — foundation models, external models, and any custom endpoints — the
          raw material of **choice**. An open ecosystem means adopting any of them without
          rebuilding governance for each.
        action:
          label: List serving endpoints
          test: list_endpoints

      - id: choice_default_access
        title: What can everyone already reach?
        concept: |
          Before adding a single control, look at the default. `system.ai` ships with
          **`EXECUTE` granted to `account users`** — inherited from the `system` catalog — so
          every user on the account can call every provided model service right now, without
          going near anything you are about to build.

          This is the Databricks default, not a misconfiguration. But it means a governed
          endpoint with guardrails, rate limits, and budgets sits *beside* an open path rather
          than in front of it. Locking down the default is the first action on the rollout
          list, and it is the finding that lands hardest with a security team.

          This step is **read-only** — it reports the grants and names the remediation.
          Narrowing access on `system` is a platform-owner decision, so the workshop shows it
          rather than changing it on your metastore.
        action:
          label: Show what all account users can reach
          test: default_access

      - id: choice_model_services
        title: The governed object — and the one client change
        concept: |
          The step that makes the rest of the workshop coherent. Previously, controls hung off
          a **workspace serving endpoint**: the endpoint name *was* the application contract,
          and access was a workspace ACL. Now they hang off a **model service** — a Unity
          Catalog securable with a fully-qualified name.

          Why that matters: the runtime can change behind a stable contract. Swap the model,
          add a fallback, split traffic — the application keeps calling the same FQN, and
          permissions are UC grants that work across every workspace on the metastore.

          The client change is exactly two things, and they must move **together**:

          - **Base URL** — `/serving-endpoints` → `/ai-gateway/mlflow/v1`
          - **Model selector** — `<endpoint-name>` → `<catalog>.<schema>.<service>`

          A new base URL with an old endpoint name fails; so does an FQN against the legacy
          path. Both paths still work today, which is what makes a staged migration safe —
          and also why teams don't notice they never actually migrated.

          There is **no in-place rename**. Stand the service up alongside the old endpoint,
          validate on real traffic, move clients in stages, then revoke the old path. A 200
          is not acceptance: compare latency, tokens, cost, and output quality.
        action:
          label: Show model services & the client contract
          test: model_services

      - id: choice_agent_registry
        title: Register agents & tools in Unity Catalog
        concept: |
          Choice isn't just models — it's **agents, MCP servers, and skills**, all registered
          as first-class Unity Catalog assets so they're discoverable, owned, and governed like
          any table. This lists the agents and UC functions (tools) already registered, the
          inventory a governance team can actually see and control.
        action:
          label: List registered agents & tools
          test: list_registered_assets

  - id: cost
    title: Cost
    tagline: Intelligent cost controls — visibility, budgets, attribution, and routing.
    steps:
      - id: cost_model_panel
        title: Three ways to route — and what each costs
        concept: |
          Most AI spend is a model-choice problem: teams send every request to a frontier
          model because it is the safe default. There are three ways to fix that, and they
          differ mainly in who owns the routing policy:

          - **Smart routing (Databricks-managed)** — the Gateway classifies each request and
            picks a suitable model for you. No policy to write. *Beta* — confirm availability
            on this account before planning around it.
          - **Omnigent (partner layer)** — an agent meta-harness above Claude Code, Codex,
            Cursor, and custom agents, with routing and policy above the harness. Governed
            through the same Gateway.
          - **Custom router (yours)** — a cheap classifier scores each request and dispatches
            to the cheapest model that clears your bar. You own the rubric.

          The router changes; the control plane does not. This workshop runs the **custom
          router**, because it is the option you can stand up today and measure. Start with
          the price panel so the arithmetic is visible before any prompt is sent.
        action:
          label: Show the model panel & routing policy
          test: routing_panel

      - id: cost_routing_compare
        title: Same prompt, three price points
        concept: |
          Send one prompt to all three models and measure real tokens, latency, and cost.
          Expect a **10-20x spread** between the cheapest and most expensive answer.

          Read the answers, not just the prices. Savings only count if quality holds — and
          sometimes the cheap model is simply wrong, which is exactly the finding that makes
          a routing rubric worth writing rather than assuming.
        action:
          label: Compare cost across models
          test: routing_compare

      - id: cost_routing_roi
        title: Measure the routing saving
        concept: |
          Now run the router end to end: classify, dispatch to the cheapest sufficient model,
          and compare against what always-frontier would have cost for the same tokens. The
          classifier is itself a model call, so **its cost counts as overhead** — that is why
          an easy prompt saves ~90% while a genuinely hard one saves nothing at all.

          Two honesty notes worth saying out loud in the room:
          - The router **fails safe**: if the classifier errors, the request goes to the
            frontier model. A router that silently downgrades on failure trades correctness
            for cost.
          - The frontier comparison prices the *routed* response's token counts, so it is a
            close estimate of the per-request delta, not an exact figure.

          To turn this into a business case, apply the per-request delta to the request mix
          in your own Gateway logs — the next two steps show that spend.
        action:
          label: Route a prompt & show the saving
          test: routing_roi

      - id: cost_spend_by_model
        title: Where the money actually goes
        concept: |
          `system.ai_gateway.external_model_spend` reports **estimated USD directly** (no
          price-list join needed) for external-provider traffic through the Gateway. Break it
          down by model to see which models dominate spend — that is where a routing policy
          has leverage, and it grounds the ROI estimate in this account's real mix.
        action:
          label: Show 30-day spend by model
          test: gateway_spend_by_model

      - id: cost_rate_limits
        title: Rate limits — the hard control
        concept: |
          Two different controls are easy to conflate. **Rate limits** cap *throughput*: an
          exceeded limit returns HTTP 429 immediately, and they are **GA**. **Budgets** cap
          *spend*, and today they reliably **alert** — hard "block usage" is still rolling
          out. So rate limits are the control you can promise a security team will hold.

          They apply per service, per user, and per group, in queries/minute (QPM) and
          tokens/minute (TPM), with the most restrictive limit winning. This reads back what
          is enforced on the governed endpoint; set limits in the AI Gateway UI so the
          workshop never changes throughput on a live customer endpoint.
        action:
          label: Show enforced rate limits
          test: rate_limits
        manual:
          label: Set a rate limit on the endpoint
          deep_link: serving_endpoint

      - id: cost_budgets
        title: Budgets & spend thresholds
        concept: |
          Budgets are scoped to the account and configured in the account console, with
          shared and per-user thresholds. **Alerts are GA; hard blocking is rolling out** —
          confirm on this account before telling a FinOps owner that spend is hard-capped.

          Enforcement is based on near-real-time estimates, so thresholds are approximate in
          both directions. Pair budgets with the rate limit above: the budget tells you when
          spend is drifting, the rate limit is what actually stops it.
        action:
          label: Show 30-day spend the budget governs
          test: budget_status
        manual:
          label: Create a budget in the account console
          deep_link: account_budgets

      - id: cost_tags
        title: Tag for cost attribution
        concept: |
          Tags turn a single AI line item into cost-per-team. This applies the workshop's
          project tags (project, cost_center, environment, use_case) to the governed service —
          so every AI dollar attributes to a team, project, and use case.

          One distinction that matters for anything financial: **server-side** tags are set by
          the platform owner on the service and apply to every request through it — those are
          the only ones you can trust as a budget filter. **Request tags** are supplied
          per-request by the caller (`Databricks-Ai-Gateway-Request-Tags`) and are great for
          attribution and analytics, but they are **caller-controlled** — never use them as an
          enforcement boundary.

          The request-tag half is already running: every model call in the routing steps above
          was sent with that header, so those tokens attribute to this project. The next step
          shows both columns side by side.

          Worth knowing if you go to instrument your own client: the Databricks SDK's
          `serving_endpoints.query()` cannot send this header at all — it targets the legacy
          invocations path and takes no headers. Tagging means calling
          `/ai-gateway/mlflow/v1/chat/completions` directly, which is what this app does.
        action:
          label: Apply project tags
          test: apply_tags

      - id: cost_usage
        title: Usage & cost by project
        concept: |
          With tags in place, `system.ai_gateway.usage` rolls up tokens by project — the
          foundation of AI FinOps and the visibility that makes AI spend predictable.

          The result splits the count two ways on purpose: **request-tagged** calls (the ones
          this app sent with the header) prove per-caller attribution works end to end, while
          **endpoint-tagged** calls are the ones a FinOps owner can trust as a budget filter
          because the caller cannot change them. Both, ideally.

          **The table is not real-time, and this trips people up.** On a reference workspace the
          latest recorded event stayed 13-21 minutes behind the wall clock. So an empty result right
          after the routing steps means *not ingested yet*, not *tagging is broken* — check
          `SELECT max(event_time) FROM system.ai_gateway.usage` before you start debugging a
          control that is actually working.
        action:
          label: Query usage by project tag
          test: usage_by_project

  - id: control
    title: Control
    tagline: Agent-aware data + AI governance — policies, guardrails, identity, and observability.
    steps:
      - id: control_governed_endpoint
        title: Create a governed endpoint
        concept: |
          A **governed endpoint** puts a control layer in front of a model: a fallback for
          resilience, an inference table that logs every payload, usage tracking, and an
          attachment point for guardrails and rate limits.
        action:
          label: Create / verify governed endpoint
          test: create_governed_endpoint
        verify:
          label: Check endpoint config
          test: verify_governed_endpoint

      - id: control_endpoint_acl
        title: Who is allowed to call it
        concept: |
          The access question, at endpoint grain: **`CAN_QUERY`**, `CAN_VIEW`, and
          `CAN_MANAGE`. Two things to read carefully in the result:

          - A broad group holding `CAN_QUERY` means the governed endpoint is open to everyone,
            which undoes the scoping you set up in Choice.
          - `CAN_MANAGE` is the **shadow-endpoint risk** — it lets someone reconfigure the
            model or strip the guardrails off it. Keep it with platform admins only.

          Note what this does *not* cover: provided foundation-model endpoints have no
          workspace ACL at all. Those are governed by the UC grants on the model service — the
          two controls are separate, and you need both.
        action:
          label: Show the endpoint ACL
          test: endpoint_acl

      - id: control_guardrails
        title: Guardrails on a model service
        concept: |
          Guardrails screen inputs and outputs for PII, unsafe content, and blocked keywords.
          PII and safety filters are configured in the AI Gateway UI (no full CRUD API yet);
          the keyword blocklist is a UC SQL function you attach as a policy.
        manual:
          label: Open the endpoint's Guardrails tab
          deep_link: serving_endpoint
        action:
          label: Test the guardrail (send a blocked prompt)
          test: test_guardrail
        verify:
          label: Show guardrail activity from the inference table
          test: guardrail_activity

      - id: control_mcp_policy
        title: Contextual policy for an MCP service
        concept: |
          MCP services expose tools to agents. A **service policy** is a UC SQL function that
          inspects each tool call and returns ALLOW / DENY — e.g. allow reads, deny writes.
          Identity propagates: the agent acts as the calling user, not a shared account.
        action:
          label: Create the policy function
          test: create_mcp_policy
        manual:
          label: Attach the policy in the AI Gateway UI
          deep_link: mcp_service
        verify:
          label: Test a write tool (expect DENY) and a read tool (expect ALLOW)
          test: test_mcp_policy

      - id: control_coding_agents
        title: Govern coding-agent traffic
        concept: |
          Developers adopt Cursor, Claude Code, Codex, and Genie Code faster than platform teams
          can govern them. Routing that traffic through the gateway gives you **per-developer
          attribution, one policy set, and secret-leak detection** — turning a blind spot into a
          governed, measured surface. This checks for coding-agent usage attributable in the
          gateway logs.
        action:
          label: Check coding-agent usage & attribution
          test: coding_agent_usage

      - id: control_audit
        title: Audit & secret-leak detection
        concept: |
          Governing what agents *do* means seeing it. `system.access.audit` records who called
          what and whether policy fired. This scans recent denied calls and looks for
          secret-shaped strings (API keys) in arguments.
        action:
          label: Query denied calls & scan for secrets
          test: audit_scan

      - id: control_traces
        title: Traces in a table
        concept: |
          MLflow traces capture agent execution — tool calls, model responses, latencies.
          Joined to the audit log by identity and time, they give end-to-end observability of
          agent behavior for investigation and optimization.
        manual:
          label: Open the MLflow experiment
          deep_link: experiment

      # control_lakewatch removed: Lakewatch is not enabled on most accounts, so the step
      # was a readiness check for a product the room could not use. The telemetry it probed
      # is already proven by cost_usage and control_audit, and the same check survives in the
      # Agent Registry accelerator as `telemetry_readiness`. Recovers ~10 minutes.
