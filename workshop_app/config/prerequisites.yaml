# Workshop prerequisites — the checklist we send the customer BEFORE the session.
#
# This is written as a note FROM the Databricks account team TO the customer, so it reads as
# customer-facing prose, not a run-of-show runbook. Config-driven (same as
# steps.yaml) so it can be tailored per customer without a code change. Rendered on the
# Prerequisites page and exported as a PDF with real checkboxes (GET /api/export/prerequisites.pdf).
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the prerequisites. The matching Google Doc is
# generated from it (so the two never drift) via the internal repo's generator:
#   python scripts/generate_google.py workshop_app/config/prerequisites.yaml --prereqs
# Link the resulting Doc back here in `google_doc_url` so the app points at the shareable copy.
#
# Two groups only — long lead time and short lead time — and only the essentials. Every item is
# tagged by persona in `who`. The workshop needs as few as THREE people:
#   - Account admin      — enables platform capabilities and runs the account-level grants.
#   - Business champion   — owns the AI budget and the "why this matters to us".
#   - Technical champion  — deploys the app and provides the catalog and warehouse.
# Everything else is optional; items only some customers need are marked `optional: true`.
#
# Fields:
#   id        stable key (used as the PDF checkbox anchor)
#   item      what needs to be true (short — it is a checkbox label)
#   why       what it buys you / what it unblocks. Plain language, customer-facing.
#   who       the persona who owns it (Account admin / Business champion / Technical champion)
#   optional  true if only some customers need it; say who/when in `why`

# Shareable Google Doc generated from this file (see the generator note in the header). Kept in
# sync by regenerating whenever this YAML changes.
google_doc_url: https://docs.google.com/document/d/12CnGW0qXCAfrL_lH8r1vPezdQvAzm5OL4GKGVdKePPE/edit

lead_time_note: >-
  These are the prerequisites for your AI Governance Workshop — getting them in place ahead of
  time is what lets us spend the three hours of hands-on time (plus about an hour of slides and
  discussion) proving governance on your own workspace instead of waiting on access. Each item
  is tagged by persona. The session needs as few as three people:
  an account admin, a business champion, and a technical champion — everyone else is optional.
  The long-lead items need an account admin and can take a few days, so please start those about
  a week out; the short-lead items we can run together the day before.

groups:
  - id: long_lead
    title: Long lead time — please start about a week out
    lead_time: Days
    intro: >-
      These need an account or metastore admin and can take a few days to arrange, so they are
      the ones that stall a workshop if we leave them to the day. Getting them done early is the
      single biggest thing you can do to make the session go smoothly.
    items:
      - id: account_admin_available
        item: Confirm an account admin is available for the setup (and ideally the session)
        why: >-
          The items that stall a workshop — enabling the Gateway, the MCP previews, and the two
          `system` grants — can **only** be done by an account admin. Name that person now so the
          long-lead work doesn't wait on tracking someone down, and ideally have them join for the
          session so anything missing can be fixed in the room.
        who: Account admin
      - id: uaig_enabled
        item: Turn on Unity AI Gateway for the account and this workspace
        why: >-
          This is the control plane the whole workshop is built on. Nothing else works until it
          is enabled, so it is the first thing to confirm. It is enabled at the **account** level
          (Account Console → Settings), not per workspace.
        who: Account admin
        blocker: true
      - id: beta_readiness
        item: Confirm your org can use Beta features — and flag CSP
        why: >-
          Unity AI Gateway and several of the system tables the telemetry steps read are still
          **Beta**. If your organization cannot run Beta features in production, tell us before
          the session — we will scope the workshop to what is GA on your account and skip the
          rest, rather than discover it live. If this workspace is on **CSP** (Compliance
          Security Profile), flag that too: some Governance Hub / cost surfaces render differently
          there, and we would rather plan around it than hit it in the room.
        who: Account admin
      - id: system_grants
        item: Grant the app read access to two `system` schemas (`system.ai_gateway` and `system.access`)
        why: >-
          These let the app read the telemetry that proves cost and control actually fired — spend
          by model, budgets, per-team attribution, and the audit trail. The app's Walkthrough page
          lists the exact GRANT statements; fill in the app's service principal (get it with
          `databricks apps get ai-governance-workshop`). If they are not ready in time the workshop
          still runs; those specific steps simply show "action needed" instead of a result.
        who: Account admin
      - id: catalog_and_warehouse
        item: Provide a Unity Catalog catalog and a running SQL warehouse the app can use
        why: >-
          The app deploys into a catalog you choose and runs every live check through the warehouse.
          A serverless warehouse starts fastest. The catalog must already exist — the app creates
          only its own schema inside it. Without Unity Catalog there is nothing to govern and the
          workshop cannot run.
        who: Technical champion
        blocker: true
      - id: pilot_users
        item: Line up a few pilot users from your identity provider
        why: >-
          Per-user cost attribution and the on-behalf-of identity demo are only convincing with real,
          separate logins. Optional, but it makes those moments land — shared logins prove nothing.
        who: Technical champion
        optional: true
      - id: uc_foundation_models
        item: Confirm Unity Catalog is enabled with foundation models available
        why: >-
          The workshop governs models, tools, and agents as Unity Catalog assets, so UC must be on
          and the account's foundation models reachable. This is usually already true wherever the
          Gateway is enabled — confirm it so the Choice steps have something to inventory and govern.
        who: Technical champion
      - id: mcp_previews
        item: Enable the MCP previews (Service policies and Managed MCP)
        why: >-
          Only needed if we plan to run the MCP governance steps or the MCP accelerator. Both are
          Beta features an account admin toggles on. You do **not** need to bring your own MCP
          server: the provided `system.ai.github` service is a ready-to-use, read-only example
          the workshop governs out of the box (it worked cleanly at a recent workshop). Bring a
          real MCP server only if you already run one and want to govern it specifically.
        who: Account admin
        optional: true
      - id: external_storage_catalog
        item: Provide an external-storage catalog for inference tables
        why: >-
          The guardrail and PII steps (and the Policies & Guardrails accelerator) log request/response
          payloads to **inference tables**, which need a catalog backed by external storage. Only
          needed if those steps are in scope — tell us and we'll confirm the catalog can host them.
        who: Technical champion
        optional: true
      - id: egress_allowlist
        item: Allowlist network egress for external providers / external MCP
        why: >-
          If we route external providers (Bedrock, OpenAI, Anthropic) or an external/custom MCP server
          through the Gateway, the workspace must be allowed to reach them. Only needed if the External
          Providers or MCP accelerators are in scope — share any egress-control (firewall/PrivateLink)
          constraints ahead of time so routing doesn't fail live.
        who: Account admin
        optional: true
      - id: external_providers_and_key
        item: Identify existing external providers and get a test API key (if you want to route them)
        why: >-
          The whole idea is to be ready to *test*, not just talk. Tell us which external providers you
          already use (Bedrock, OpenAI, Anthropic, Azure OpenAI, self-hosted) and — if you'd like to
          govern them — bring at least one **test API key** we can store in a secret scope and route
          live through the Gateway. This is what makes the External Providers accelerator real instead
          of a slide; without a key we can only describe it. Only needed if external providers are in
          scope. Pairs with the egress allowlist above.
        who: Account admin
        optional: true
      - id: private_networking
        item: Identify private-networking requirements and test connectivity ahead of time
        why: >-
          Tell us about any private networking (PrivateLink / VPC / firewall egress rules, NCC, storage
          firewalls) and let's **test it before the session**. This matters most for the two things
          that are easy to get wrong live: **inference tables** (guardrail/PII logging writes to
          external storage) and **end-to-end tracing / audit** (the telemetry must actually reach the
          system tables and any SIEM). Confirming the paths early means the Control steps prove
          something instead of timing out.
        who: Account admin

  - id: short_lead
    title: Short lead time — the day before (with us, if you like)
    lead_time: Minutes to an hour
    intro: >-
      Quick to do once the long-lead items are in place. We are happy to walk through these together
      on a short call the day before so the room opens to a working app.
    items:
      - id: deploy_app
        item: "Deploy the app to your workspace and confirm it is healthy"
        why: >-
          You run this in your own environment to try the capabilities first-hand. It is a
          standard Databricks Asset Bundle — no scripts. From the `workshop_app/` folder:
          `databricks bundle deploy -t dev -p <profile> --var="warehouse_id=<id>" --var="catalog=<uc-catalog>"`
          then `databricks bundle run ai_governance_workshop_app -t dev -p <profile>`. Open the
          app URL it prints and check `GET /api/health` returns `{"status":"ok","config_problems":[]}`.
          If it names a problem, that is exactly what still needs setting.
        who: Technical champion
      - id: sample_prompt_and_rate
        item: Pick a representative prompt and share your negotiated $/DBU rate
        why: >-
          The cost-routing step shows real savings, and the number only persuades when it runs on
          your kind of work at your price. A generic prompt at list price produces a figure nobody
          believes.
        who: Business champion
      - id: budget_owner
        item: Have the person who owns the AI budget in the room
        why: >-
          The cost pillar lands when the budget owner sees spend, budgets, and hard caps live. If
          that is not the business champion, invite them for that hour.
        who: Business champion
      - id: accelerator_choice
        item: Decide whether to run an accelerator, and which one
        why: >-
          There are six optional ~3-hour deep dives (MCP, agent registry, coding agents, external
          providers, policies & guardrails, and skills). Pick the one matching your top priority —
          we won't run all of them, there isn't time.
        who: Business champion
        optional: true
      - id: target_mcp_or_agent
        item: Have a target agent or MCP server to govern (Agents / MCP accelerators)
        why: >-
          The Agents and MCP accelerators land best on something you actually run — bring one target
          agent or MCP server to register and govern. If you'd rather see the mechanics first, the
          provided read-only `system.ai.github` MCP works out of the box. Only needed if those
          accelerators are in scope.
        who: Technical champion
        optional: true
      - id: coding_agent_configured
        item: Point a coding agent at the Gateway for one developer (Coding Agents accelerator)
        why: >-
          The Coding Agents accelerator proves per-developer attribution and a live rate-limit 429,
          so it needs at least one real coding agent (Claude Code, Cursor, etc.) configured against
          the Gateway ahead of time. Only needed if that accelerator is in scope.
        who: Technical champion
        optional: true
      - id: security_stakeholder
        item: Invite a security / compliance stakeholder for the Control hour
        why: >-
          The Control pillar — guardrails, policies, audit — turns from a demo into a real evaluation
          when the person who owns security or compliance sign-off is in the room to watch it fire.
          Optional, but it's what makes Control land with the buyer who cares most.
        who: Business champion
        optional: true
