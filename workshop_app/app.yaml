command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Lakebase progress store — PGHOST/PGUSER/PGPORT auto-injected by the `database` resource.
  # PGINSTANCE/PGSCHEMA also come from config/workshop.yaml if unset here.
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGSSLMODE
    value: "require"
