command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Bind the app's SQL warehouse to the bundle's `sql-warehouse` resource, so the value
  # passed as `--var="warehouse_id=..."` is what the app actually queries. Without this the
  # app silently falls back to config/workshop.yaml and every SQL step fails on a workspace
  # where that id does not exist.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # Lakebase progress store — PGHOST/PGUSER/PGPORT auto-injected by the `database` resource.
  # PGINSTANCE/PGSCHEMA also come from config/workshop.yaml if unset here.
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGSSLMODE
    value: "require"
