# AI Governance Workshop — Databricks Asset Bundle (customer-deployable).
#
# Deploy on any customer workspace:
#   1. Edit config/workshop.yaml (warehouse_id, catalog/schema, endpoints, mcp, project).
#   2. databricks bundle deploy -t dev -p <your-profile>     # builds the frontend for you
#   3. databricks bundle run ai_governance_workshop_app -t dev -p <your-profile>
#
# workspace.host is intentionally not set — the target comes from --profile.
bundle:
  name: ai-governance-workshop

# The frontend is a compiled artifact: the FastAPI backend serves frontend/dist and never
# reads frontend/src, so `src` changes are invisible until the bundle is rebuilt.
#
# `dist` is gitignored (a 240KB single-line bundle dominates every diff and overflows review
# tooling), which used to make the build a MANUAL prerequisite — and a forgotten build was
# silent: `bundle deploy` happily uploaded a stale or empty dist and the app served a blank
# page with no error anywhere. Owning the build here makes `bundle deploy` the single entry
# point and turns a broken build into a loud, immediate failure.
#
# `type` is deliberately omitted — it is only for whl/jar. An artifact with just `build`,
# `path`, and `files` is a plain local build step.
#
# Does NOT require npm on every deploy: build.sh skips the build when dist/ is already newer
# than every source file, so a dist built elsewhere (or by CI) deploys with no network access.
# npm is only needed when dist is genuinely stale. On a Databricks-managed laptop the public
# registry is blocked by the Jamf JAMF-DNS-v1 control — use the Databricks npm proxy (README).
artifacts:
  frontend:
    path: ./frontend
    # Delegated to a script because `bundle deploy` runs this unconditionally and with no
    # timeout: a bare `npm install` on a machine with the public registry blocked retries
    # until it hangs, so the deploy never finishes. build.sh skips the build when dist/ is
    # already newer than every source file, and fails loudly (never silently) when dist is
    # stale and cannot be rebuilt. It uses `npm ci` (reproducible, lockfile-exact).
    build: ./build.sh
    files:
      # Declaring the entry point makes the CLI fail if the build produced nothing, instead
      # of deploying an empty dist. Vite content-hashes the asset filenames, so only
      # index.html is stable enough to assert on.
      - source: ./frontend/dist/index.html

# config/*.yaml must be synced with the app source (customer-edited config lives here).
# Sync honors .gitignore, so the gitignored build output has to be re-included explicitly.
# frontend/src is excluded because only the built output is served.
sync:
  include:
    - "frontend/dist/**"
    # Generated by deploy.sh to pin catalog/schema. Gitignored (it is per-deployment), so
    # it must be re-included or the app would fall back to the placeholder config. Globbed
    # rather than named so a bundle command before the first deploy.sh run does not warn
    # about a missing file.
    - "config/workshop.local.*"
  exclude:
    - "frontend/src"

variables:
  # Required, with no default. A bundle command missing one of these fails immediately
  # ("no value assigned to required variable ...") rather than deploying an app that looks
  # fine and then fails every governance step in front of the customer.
  warehouse_id:
    description: "SQL warehouse id the app uses. Find one: databricks warehouses list"
  catalog:
    description: "Existing UC catalog to create the workshop schema in, e.g. main."
  app_service_principal_id:
    description: >-
      Service principal id of the app, so the bundle can grant it the UC privileges it
      needs. The app must exist before its principal does, so deploy.sh deploys once
      without this, reads the id back, and re-deploys with it. Defaults to the deploying
      user, which keeps the first pass valid (Terraform rejects an unknown principal) and
      is harmless: that user already owns the schema.
    default: ${workspace.current_user.userName}
  workshop_group:
    description: "Group granted CAN_USE on the app so attendees can open it."
    default: users
  schema:
    description: "UC schema for workshop artifacts (policy function, inference tables)."
    default: ai_governance_workshop
  lakebase_instance:
    description: "Lakebase instance name that backs workshop progress."
    default: ai-governance-workshop

resources:
  database_instances:
    workshop_lakebase:
      name: ${var.lakebase_instance}
      capacity: CU_1

  # The app writes the MCP service-policy function here and reads inference tables from
  # here. Without this the schema never exists and those steps fail on a fresh workspace.
  schemas:
    workshop_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "AI Governance Workshop artifacts (service policies, inference tables)."
      # Grant the app's service principal what it needs here, so the only manual grants
      # left are the two `system` schemas (which DABs cannot express and which need an
      # account admin anyway). On the first deploy this is the literal "PENDING", which is
      # not a real principal — see the variable description.
      grants:
        - principal: ${var.app_service_principal_id}
          privileges:
            - USE_SCHEMA
            - CREATE_FUNCTION
            - EXECUTE
            - SELECT
            - MODIFY

  apps:
    ai_governance_workshop_app:
      name: ai-governance-workshop
      description: "AI Governance Workshop — guided choice/cost/control with live tests."
      source_code_path: ./
      # Attendees need to open the app, not just the deployer.
      permissions:
        - level: CAN_USE
          group_name: ${var.workshop_group}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: database
          database:
            # Reference the resource (not var.lakebase_instance) so Terraform orders the
            # instance before the app. A plain string creates no dependency edge, which is
            # why the app could previously start before Lakebase was AVAILABLE.
            instance_name: ${resources.database_instances.workshop_lakebase.name}
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    # `mode: development` is deliberately NOT used. It prefixes `schemas` names
    # (dev_<user>_<name>) while leaving apps and database_instances literal, which would
    # point the app at a schema the bundle did not create. Names stay literal here so the
    # bundle, config/workshop.yaml, and the running app all agree.
    default: true
  prod:
    mode: production
